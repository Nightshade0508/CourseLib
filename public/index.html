<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Parallel Text Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500;1,6..72,600&family=Noto+Serif+SC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/shell.css">
<link rel="stylesheet" href="css/document.css">
<link rel="stylesheet" href="css/dialogs.css">
<link rel="stylesheet" href="css/annotations.css">
<link rel="stylesheet" href="css/player.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/documents.css">
<link rel="stylesheet" href="css/study.css">
<link rel="stylesheet" href="css/views.css">
<link rel="stylesheet" href="css/settings.css">
<link rel="stylesheet" href="css/palette.css">
<link rel="stylesheet" href="css/learn.css">
<link rel="stylesheet" href="css/account.css">
</head>
<body>

<symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l1 12.5h9l1-12.5M10 11v5.5M14 11v5.5"/></symbol>

<symbol id="i-sync" viewBox="0 0 24 24"><path d="M19 12a7 7 0 0 1-12.2 4.7M5 12a7 7 0 0 1 12.2-4.7M17.5 3.5v4h-4M6.5 20.5v-4h4"/></symbol>
<symbol id="i-link" viewBox="0 0 24 24"><path d="M10.5 13.5a4 4 0 0 0 5.7 0l2.8-2.8a4 4 0 0 0-5.7-5.7l-1.1 1.1M13.5 10.5a4 4 0 0 0-5.7 0L5 13.3A4 4 0 0 0 10.7 19l1.1-1.1"/></symbol>
<symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="3.5"/><path d="M10.5 12.5 19 4M16 7l2.5 2.5M14 9l2 2"/></symbol>

</svg>
<div class="shell" id="shell">
  <aside class="side" id="side" aria-label="文库">
    <div class="side-head">
      <div class="brand">
        <span class="brand-mark"><svg class="ic" aria-hidden="true"><use href="#i-book"></use></svg></span>
        <span class="brand-txt"><span class="brand-t">Parallel Text Library</span><span class="brand-s">中英对照阅读库 · Jack Chu</span></span>
      </div>
      <button class="icon-btn" id="sideclose" type="button" title="收起侧栏" aria-label="收起侧栏"><svg class="ic" aria-hidden="true"><use href="#i-sidebar"></use></svg></button>
    </div>
    <div id="nav"></div>
    <div class="side-foot">
      <button class="new-btn" id="newbtn" type="button"><svg class="ic" aria-hidden="true"><use href="#i-plus"></use></svg><span>新建</span><kbd class="nb-k">N</kbd></button>
      <div id="user"></div>
      <div class="sf-row">
        <div id="acct"></div>
        <button class="icon-btn" id="moremenu" type="button" title="更多" aria-label="更多"><svg class="ic" aria-hidden="true"><use href="#i-more"></use></svg></button>
      </div>
    </div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <main class="main">
    <div class="toolbar" id="toolbar">
      <button class="icon-btn" id="sidetoggle" type="button" title="侧栏" aria-expanded="true" aria-label="打开或收起侧栏"><svg class="ic" aria-hidden="true"><use href="#i-sidebar"></use></svg></button>
      <span class="tb-title" id="tbtitle"></span>
      <div class="tb-group">
        <div class="seg" id="langseg" role="group" aria-label="语言显示">
          <button type="button" data-lang="both" title="中英对照">对照</button>
          <button type="button" data-lang="en" title="仅英文">EN</button>
          <button type="button" data-lang="zh" title="仅中文">中</button>
          <button type="button" data-lang="blur" title="学习模式：先读英文，需要时再看中文">学</button>
        </div>
        <button class="icon-btn" id="typoopen" type="button" title="阅读设置" aria-label="阅读设置" aria-expanded="false" aria-controls="typo"><svg class="ic" aria-hidden="true"><use href="#i-type"></use></svg></button>
        <button class="icon-btn" id="ttsopen" type="button" title="听书" aria-label="听书"><svg class="ic" aria-hidden="true"><use href="#i-headphones"></use></svg></button>
        <button class="icon-btn" id="vpopen" type="button" title="语音包管理" aria-label="语音包管理" hidden><svg class="ic" aria-hidden="true"><use href="#i-gear"></use></svg></button>
        <button class="icon-btn" id="cmdkopen" type="button" title="搜索与命令（⌘K）" aria-label="搜索与命令"><svg class="ic" aria-hidden="true"><use href="#i-search"></use></svg></button>
        <button class="icon-btn" id="tocopen" type="button" title="显示目录" aria-label="显示目录" hidden><svg class="ic" aria-hidden="true"><use href="#i-toc"></use></svg></button>
      </div>
    </div>
    <div class="typo" id="typo" hidden role="dialog" aria-label="阅读设置">
      <div class="ty-row"><span class="ty-l">主题</span><div class="seg icons" id="themeseg" role="group" aria-label="明暗主题">
          <button type="button" data-theme="system" title="跟随系统" aria-label="跟随系统"><svg class="ic" aria-hidden="true"><use href="#i-auto"></use></svg></button>
          <button type="button" data-theme="light" title="明亮" aria-label="明亮"><svg class="ic" aria-hidden="true"><use href="#i-sun"></use></svg></button>
          <button type="button" data-theme="dark" title="暗色" aria-label="暗色"><svg class="ic" aria-hidden="true"><use href="#i-moon"></use></svg></button>
        </div></div>
      <div class="ty-row"><span class="ty-l">字号</span><div class="ty-step"><button type="button" data-fs="-1" aria-label="缩小字号">A<small>−</small></button><span id="ty-fs">100%</span><button type="button" data-fs="1" aria-label="放大字号">A<small>+</small></button></div></div>
      <div class="ty-row"><span class="ty-l">行距</span><div class="seg" id="ty-lh" role="group" aria-label="行距"><button type="button" data-v="compact">紧凑</button><button type="button" data-v="normal">标准</button><button type="button" data-v="relaxed">宽松</button></div></div>
      <div class="ty-row"><span class="ty-l">栏宽</span><div class="seg" id="ty-w" role="group" aria-label="栏宽"><button type="button" data-v="narrow">窄</button><button type="button" data-v="normal">标准</button><button type="button" data-v="wide">宽</button></div></div>
      <div class="ty-row"><span class="ty-l">字体</span><div class="seg" id="ty-ff" role="group" aria-label="字体"><button type="button" data-v="serif">衬线</button><button type="button" data-v="sans">无衬线</button></div></div>
      <div class="ty-row"><span class="ty-l">句子对齐</span><div class="seg" id="ty-al" role="group" aria-label="句子对齐"><button type="button" data-v="on">悬停高亮</button><button type="button" data-v="off">关</button></div></div>
      <div class="ty-sec"><span>学习模式</span><span class="ty-hint">工具栏「学」</span></div>
      <div class="ty-row"><span class="ty-l">隐藏中文</span><div class="seg" id="ty-learn" role="group" aria-label="隐藏哪些中文"><button type="button" data-v="smart">读得懂的</button><button type="button" data-v="all">全部</button></div></div>
      <div class="ty-row ty-smart"><span class="ty-l">词汇量</span><div class="ty-step"><button type="button" data-vl="-1" aria-label="减少词汇量">−</button><span id="ty-vl">8000</span><button type="button" data-vl="1" aria-label="增加词汇量">+</button></div></div>
      <label class="ty-check ty-smart"><input type="checkbox" id="ty-vauto"><span>根据阅读自动调整</span></label>
      <p class="ty-stat" id="ty-stat"></p>
      <div class="ty-foot"><button type="button" class="ty-focus" id="ty-focus"><svg class="ic" aria-hidden="true"><use href="#i-focus"></use></svg><span>专注模式</span><kbd>F</kbd></button><button type="button" class="ty-reset" id="ty-reset">恢复默认</button></div>
    </div>
    <div class="reading">
      <div class="docwrap">
        <article class="doc" id="viewpane" hidden></article>
        <article class="doc" id="userdoc" hidden></article>
      </div>
      <aside class="toc" id="toc" hidden>
        <div class="toc-head">
          <span class="toc-title">本篇目录</span>
          <button class="icon-btn" id="tocclose" type="button" title="隐藏目录" aria-label="隐藏目录"><svg class="ic" aria-hidden="true"><use href="#i-close"></use></svg></button>
        </div>
        <nav class="toc-list" id="toclist"></nav>
      </aside>
    </div>
  </main>
</div>

<div class="mroot" id="modal" hidden></div>
<div class="selbar" id="selbar" hidden role="toolbar" aria-label="标注工具">
  <button type="button" class="sw c-y" data-act="h" data-c="y" title="高亮 · 黄" aria-label="黄色高亮"></button>
  <button type="button" class="sw c-g" data-act="h" data-c="g" title="高亮 · 绿" aria-label="绿色高亮"></button>
  <button type="button" class="sw c-b" data-act="h" data-c="b" title="高亮 · 蓝" aria-label="蓝色高亮"></button>
  <button type="button" class="sw c-r" data-act="h" data-c="r" title="高亮 · 红" aria-label="红色高亮"></button>
  <span class="sb-sep" aria-hidden="true"></span>
  <button type="button" data-act="u" title="下划线" aria-label="下划线"><svg class="ic" aria-hidden="true"><use href="#i-underline"></use></svg></button>
  <button type="button" data-act="b" title="加粗" aria-label="加粗"><svg class="ic" aria-hidden="true"><use href="#i-bold"></use></svg></button>
  <button type="button" data-act="x" title="清除标注" aria-label="清除标注"><svg class="ic" aria-hidden="true"><use href="#i-eraser"></use></svg></button>
  <span class="sb-sep" aria-hidden="true"></span>
  <button type="button" class="rd" data-act="read" title="从这里开始朗读"><svg class="ic" aria-hidden="true"><use href="#i-speak"></use></svg><span>朗读</span></button>
</div>
<div class="player" id="player" hidden role="region" aria-label="听书">
  <div class="pl-row">
    <div class="pl-ctrl">
      <button class="icon-btn" id="plprev" type="button" title="上一句" aria-label="上一句"><svg class="ic" aria-hidden="true"><use href="#i-back"></use></svg></button>
      <button class="pl-play" id="plplay" type="button" title="播放" aria-label="播放"><svg class="ic fill" aria-hidden="true"><use href="#i-play"></use></svg></button>
      <button class="icon-btn" id="plnext" type="button" title="下一句" aria-label="下一句"><svg class="ic" aria-hidden="true"><use href="#i-fwd"></use></svg></button>
    </div>
    <div class="pl-meta">
      <div class="pl-top"><span class="pl-t" id="plstatus">点击正文任意位置，即从该处开始</span><span class="pl-time" id="pltime" title="按当前旁白和语速估算，播放时会自动校准"></span></div>
      <div class="pl-bar" id="plbar" title="点击跳转到对应位置"><span id="plprog"></span></div>
    </div>
    <button class="icon-btn" id="plsettings" type="button" title="语音包管理" aria-label="语音包管理"><svg class="ic" aria-hidden="true"><use href="#i-gear"></use></svg></button>
    <button class="icon-btn" id="plclose" type="button" title="关闭听书" aria-label="关闭听书"><svg class="ic" aria-hidden="true"><use href="#i-close"></use></svg></button>
  </div>
  <div class="pl-row pl-opts">
    <div class="seg" id="pllang" role="group" aria-label="朗读语言">
      <button type="button" data-l="en">English</button>
      <button type="button" data-l="zh">中文</button>
    </div>
    <label class="pl-sel voice"><span>旁白</span><select id="plvoice" aria-label="旁白声音"></select></label>
    <label class="pl-sel"><span>语速</span><select id="plrate" aria-label="语速">
      <option value="0.75">0.75×</option><option value="0.9">0.9×</option><option value="1">1.0×</option><option value="1.15">1.15×</option>
      <option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="1.75">1.75×</option><option value="2">2.0×</option></select></label>
  </div>
  <p class="pl-note" id="plnote" hidden></p>
</div>


<script src="config.js"></script>
<script src="library.js"></script>
<script type="module" src="app/main.js"></script>

</body>
</html>
