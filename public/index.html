<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>Parallel Text Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500;1,6..72,600&family=Noto+Serif+SC:wght@400;500;700&display=swap">
<style>
/* Layout: a quiet two-pane reading room. Hairline sidebar of folders, one centred reading column, a slim outline rail on wide screens.
   Palette: alpine stone neutrals with one deep evergreen used only for "you are here". */
:root{
  --bg:#F3F3F0;          /* stone ground */
  --panel:#F8F8F6;       /* sidebar, raised plates */
  --surface:#FFFFFF;     /* menus, dialogs */
  --ink:#1C1F1D;         /* primary text */
  --ink-2:#4A4F4B;       /* secondary text */
  --muted:#8A8F8B;       /* labels, meta */
  --rule:#E0E2DD;        /* hairlines */
  --rule-soft:#E9EAE6;
  --accent:#2C3E35;      /* evergreen, active state only */
  --accent-soft:#E4E9E5;
  --zh-ink:#383D39;
  --scrim:rgba(20,24,22,.32);
  --shadow:0 1px 2px rgba(20,24,22,.04),0 12px 32px rgba(20,24,22,.08);
  --danger:#9A3B2E;
  --f-read:"Newsreader","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --f-zh:"Noto Serif SC","Songti SC","Source Han Serif SC","STSong",serif;
  --f-ui:"Instrument Sans","Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
  --side-w:288px;
  --bar-h:56px;
  --ease:cubic-bezier(.22,.8,.24,1);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111312; --panel:#151817; --surface:#1B1F1D; --ink:#E8EAE7; --ink-2:#B6BBB7; --muted:#7D837F;
    --rule:#262A28; --rule-soft:#1E2220; --accent:#C3D3C9; --accent-soft:#1F2824; --zh-ink:#D2D6D2;
    --scrim:rgba(0,0,0,.5); --shadow:0 1px 2px rgba(0,0,0,.3),0 16px 40px rgba(0,0,0,.45); --danger:#E08A7C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111312; --panel:#151817; --surface:#1B1F1D; --ink:#E8EAE7; --ink-2:#B6BBB7; --muted:#7D837F;
  --rule:#262A28; --rule-soft:#1E2220; --accent:#C3D3C9; --accent-soft:#1F2824; --zh-ink:#D2D6D2;
  --scrim:rgba(0,0,0,.5); --shadow:0 1px 2px rgba(0,0,0,.3),0 16px 40px rgba(0,0,0,.45); --danger:#E08A7C;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-read);font-size:17px;line-height:1.7;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit}
::selection{background:var(--accent-soft)}
.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.zh,.dz,.ni-z,p.zh,td.zh,.ap,.nb,.f-name{font-family:var(--f-zh)}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);min-height:100vh}
.shell.side-closed{grid-template-columns:0 minmax(0,1fr)}
.shell.side-closed .side{visibility:hidden}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--panel);border-right:1px solid var(--rule);
  display:flex;flex-direction:column;gap:28px;padding:22px 16px 28px;overscroll-behavior:contain}
.side-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 6px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-mark{width:34px;height:34px;border-radius:9px;border:1px solid var(--rule);display:grid;place-items:center;color:var(--ink);background:var(--surface)}
.brand-mark .ic{width:18px;height:18px}
.brand-txt{display:flex;flex-direction:column;min-width:0}
.brand-t{font-family:var(--f-read);font-size:17px;font-weight:500;letter-spacing:-.005em;line-height:1.2}
.brand-s{font-family:var(--f-ui);font-size:11.5px;color:var(--muted);letter-spacing:.01em;margin-top:2px}
#nav{display:flex;flex-direction:column;gap:26px}
.folder{display:flex;flex-direction:column}
.f-head{display:flex;align-items:center;gap:4px;padding:0 2px 0 6px}
.f-code{margin:0;flex:1;min-width:0;font:inherit}
.f-toggle{width:100%;display:flex;align-items:center;gap:8px;background:none;border:0;cursor:pointer;padding:6px 0;
  font-family:var(--f-ui);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);text-align:left}
.f-toggle:hover{color:var(--ink)}
.f-toggle .chev{width:14px;height:14px;color:var(--muted);transition:transform .34s var(--ease)}
.folder.closed .f-toggle .chev{transform:rotate(-90deg)}
.f-code-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.f-count{font-size:11px;font-weight:500;letter-spacing:0;color:var(--muted);font-variant-numeric:tabular-nums}
.f-name{margin:-2px 0 4px;padding:0 6px 0 28px;font-size:12.5px;color:var(--muted);line-height:1.45;font-style:normal}
.f-body{display:grid;grid-template-rows:1fr;opacity:1;transition:grid-template-rows .34s var(--ease),opacity .26s ease}
.folder.closed .f-body{grid-template-rows:0fr;opacity:0}
.f-inner{min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:6px;visibility:visible;transition:visibility 0s}
.f-inner>:first-child{margin-top:6px}
.f-inner>.f-name:first-child{margin-top:4px}
.folder.closed .f-inner{visibility:hidden;transition:visibility 0s .34s}
.f-list li{transition:transform .34s var(--ease),opacity .3s ease;transition-delay:calc(var(--i,0) * 22ms)}
.folder.closed .f-list li{transform:translateY(-6px);opacity:0;transition-delay:0s}
.f-list li:hover .row-btn,.f-list li:focus-within .row-btn{transition-delay:0s}
.f-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.f-list li{display:flex;align-items:center;gap:2px;position:relative}
.f-empty{padding:6px 12px 6px 28px;font-family:var(--f-ui);font-size:12.5px;color:var(--muted)}
.navitem{flex:1;min-width:0;text-align:left;background:none;border:0;cursor:pointer;border-radius:10px;
  padding:9px 12px 10px 28px;display:flex;flex-direction:column;gap:3px;color:var(--ink-2);transition:background .15s ease,color .15s ease}
.navitem:hover{background:var(--rule-soft);color:var(--ink)}
.navitem.on{background:var(--accent-soft);color:var(--accent)}
.ni-t{font-family:var(--f-ui);font-size:13.5px;font-weight:500;line-height:1.35;letter-spacing:-.003em}
.ni-z{font-size:12px;color:var(--muted);line-height:1.45}
.navitem.on .ni-z{color:var(--ink-2)}
.row-btn{opacity:0;transition:opacity .15s ease,background .15s,color .15s;position:absolute;right:4px;top:8px;background:var(--panel)}
.navitem.on + .row-btn{background:var(--accent-soft)}
.f-list li:hover .row-btn,.f-list li:focus-within .row-btn{opacity:1}
.side-actions{display:flex;flex-direction:column;gap:6px}
.ghost-btn{display:flex;align-items:center;gap:10px;text-align:left;background:none;border:1px solid var(--rule);color:var(--ink-2);
  border-radius:10px;padding:9px 12px;font-family:var(--f-ui);font-size:13px;cursor:pointer;transition:border-color .15s,color .15s,background .15s}
.ghost-btn:hover{border-color:var(--ink-2);color:var(--ink);background:var(--surface)}
.ghost-btn .ic{width:16px;height:16px}
.side-note{font-family:var(--f-ui);font-size:12px;color:var(--muted);line-height:1.55;margin:0;padding:0 6px}
.about{margin-top:auto;padding:16px 6px 0;border-top:1px solid var(--rule-soft)}
.about p{margin:0;font-size:12px;color:var(--muted);line-height:1.65}
.about p+p{margin-top:8px}

/* ---------- icon buttons & segmented controls ---------- */
.icon-btn{display:inline-grid;place-items:center;width:34px;height:34px;border:0;border-radius:9px;background:none;color:var(--ink-2);cursor:pointer;
  transition:background .15s,color .15s}
.icon-btn:hover{background:var(--rule-soft);color:var(--ink)}
.icon-btn .ic{width:18px;height:18px}
.row-btn.icon-btn{width:28px;height:28px}
.row-btn .ic{width:16px;height:16px}
.seg{display:inline-flex;align-items:center;gap:2px;padding:3px;border-radius:11px;background:var(--rule-soft)}
.seg button{border:0;background:none;cursor:pointer;height:28px;min-width:34px;padding:0 10px;border-radius:8px;
  font-family:var(--f-ui);font-size:12.5px;font-weight:500;color:var(--muted);display:inline-grid;place-items:center;transition:background .15s,color .15s}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg.icons button{padding:0;width:32px;min-width:32px}
.seg.icons .ic{width:16px;height:16px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- toolbar ---------- */
.main{min-width:0}
.toolbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:var(--bar-h);display:flex;align-items:center;gap:10px;
  padding:0 28px 0 20px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.2) blur(14px);-webkit-backdrop-filter:saturate(1.2) blur(14px);
  border-bottom:1px solid var(--rule-soft)}
.tb-title{flex:1;min-width:0;font-family:var(--f-ui);font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .2s}
.toolbar.scrolled .tb-title{opacity:1}
.tb-group{display:flex;align-items:center;gap:10px}
.tb-sep{width:1px;height:20px;background:var(--rule)}
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);backdrop-filter:blur(2px)}

/* ---------- reading layout ---------- */
.reading{display:grid;grid-template-columns:minmax(0,1fr) 240px;align-items:start}
.reading.no-toc{grid-template-columns:minmax(0,1fr)}
.docwrap{min-width:0}
.doc{max-width:720px;margin:0 auto;padding:64px 40px 140px}
.dochead{display:flex;flex-direction:column;gap:14px;padding-bottom:36px;margin-bottom:40px;border-bottom:1px solid var(--rule)}
.eyebrow{margin:0;font-family:var(--f-ui);font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.dt{margin:0;font-family:var(--f-read);font-size:clamp(30px,4.2vw,42px);line-height:1.1;font-weight:500;letter-spacing:-.018em;text-wrap:balance}
.dz{margin:0;font-size:17px;line-height:1.6;color:var(--ink-2)}
.dauth{margin:0;font-size:16px;font-style:italic;color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{font-family:var(--f-ui);font-size:11.5px;color:var(--ink-2);border:1px solid var(--rule);border-radius:999px;padding:4px 11px;line-height:1.4}

/* ---------- document body ---------- */
.docbody{font-size:17.5px;line-height:1.72}
.docbody > *:first-child{margin-top:0}
.docbody h1{font-size:28px;font-weight:500;line-height:1.2;letter-spacing:-.01em;margin:64px 0 18px;text-wrap:balance}
.docbody h2{font-size:25px;font-weight:500;line-height:1.25;letter-spacing:-.012em;margin:72px 0 26px;text-wrap:balance}
.docbody h1 .zh,.docbody h2 .zh{display:block;margin-top:8px;font-size:15px;font-weight:400;letter-spacing:0;color:var(--muted)}
.docbody h3{font-size:19px;font-weight:500;margin:40px 0 14px}
.docbody h3.an2{font-size:16px;font-weight:600;margin:32px 0 12px}
.docbody h3.an2 .zh{display:block;font-size:13.5px;font-weight:400;color:var(--muted);margin-top:4px}
.docbody h2.an{font-size:21px}
.docbody .sub{font-style:italic;font-size:18px;margin:6px 0 0}
.docbody .sub .zh{display:block;font-style:normal;font-size:15px;color:var(--ink-2);margin-top:4px}
.docbody .src{font-family:var(--f-zh);font-size:13.5px;line-height:1.85;color:var(--ink-2);margin:0 0 44px;padding:18px 20px;background:var(--panel);
  border:1px solid var(--rule-soft);border-radius:12px}
.docbody .pg{display:flex;align-items:center;gap:14px;margin:52px 0 28px;font-family:var(--f-ui);font-size:11px;letter-spacing:.12em;color:var(--muted);font-variant-numeric:tabular-nums}
.docbody .pg::after{content:"";flex:1;height:1px;background:var(--rule-soft)}
.docbody .pair{display:flex;flex-direction:column;gap:10px;margin:0 0 30px}
.docbody .pair p{margin:0}
.docbody p.en{color:var(--ink)}
.docbody p.zh{font-size:16px;line-height:1.95;color:var(--zh-ink)}
.docbody .pair.quote{margin:8px 0 34px;padding:2px 0 2px 22px;border-left:1px solid var(--ink-2);font-size:16px}
.docbody .pair.quote p.zh{font-size:15px}
.docbody .pair.quote .cite{font-family:var(--f-ui);font-size:11px;letter-spacing:.06em;color:var(--muted)}
.docbody .pair.insert,.docbody .pair.fnote{padding:18px 22px;background:var(--panel);border:1px solid var(--rule-soft);border-radius:12px;font-size:15px;line-height:1.7}
.docbody .pair.insert{margin:6px 0 20px}
.docbody .pair.insert + .pair.insert{margin-top:-8px}
.docbody .pair.insert p.zh,.docbody .pair.fnote p.zh{font-size:14.5px;line-height:1.85}
.docbody .pair.fnote p.en{color:var(--ink-2)}
.docbody .pair.it p.en{font-style:italic}
.docbody .rm{font-style:normal}
.docbody .pair.center{text-align:center;align-items:center;margin:40px 0;font-variant-caps:all-small-caps;letter-spacing:.06em}
.docbody .pair.center p.zh{font-variant-caps:normal;letter-spacing:.04em}
.docbody .pair.vprose{font-size:18px}
.docbody .epi{margin:0 0 6px;font-size:15px}
.docbody .epi .en{font-style:italic}
.docbody .attr{font-family:var(--f-ui);font-size:12.5px;color:var(--muted);margin:0 0 28px}
.docbody .ap{margin:0 0 14px;color:var(--zh-ink);font-size:16px;line-height:1.95}
.docbody .apair{margin:0 0 18px}
.docbody .sec{display:flex;align-items:center;gap:16px;margin:84px 0 36px;font-family:var(--f-ui);font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-2)}
.docbody .sec::before,.docbody .sec::after{content:"";flex:1;height:1px;background:var(--rule)}
.docbody .sec .zh{font-family:var(--f-zh);letter-spacing:.06em;text-transform:none;font-weight:400;color:var(--muted)}
.docbody figure{margin:44px 0;display:flex;flex-direction:column;align-items:center;gap:14px}
.docbody figure img{max-width:min(100%,520px);height:auto;border-radius:6px;border:1px solid var(--rule-soft)}
.docbody figcaption{align-self:stretch;font-size:13.5px;line-height:1.65;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.docbody figcaption .en{font-style:italic}
.docbody sup{font-family:var(--f-ui);font-size:.6em;vertical-align:super;line-height:0;color:var(--muted);margin-left:1px}
.docbody .note{font-family:var(--f-zh);font-size:13px;line-height:1.8;color:var(--muted);border-top:1px solid var(--rule);padding-top:18px;margin-top:64px}
.tablewrap{overflow-x:auto}
.docbody table:not(.verse){display:block;overflow-x:auto;border-collapse:collapse;width:100%;font-family:var(--f-ui);font-size:13px;margin:28px 0;font-variant-numeric:tabular-nums}
.docbody table:not(.verse) th,.docbody table:not(.verse) td{border-bottom:1px solid var(--rule);padding:9px 12px;text-align:left;vertical-align:top}
.docbody table:not(.verse) th{font-weight:600;color:var(--ink-2)}
.docbody code{font-family:ui-monospace,Menlo,monospace;font-size:.88em;background:var(--rule-soft);padding:1px 5px;border-radius:4px}
.docbody ul:not(.refs){padding-left:22px;margin:0 0 18px}
.docbody ul:not(.refs) li{margin-bottom:6px}
.docbody ul.refs{list-style:none;margin:14px 0 0;padding:0;font-size:14px;line-height:1.6;color:var(--ink-2);display:flex;flex-direction:column;gap:9px}
.docbody ul.refs li{padding-left:24px;text-indent:-24px;overflow-wrap:anywhere}

/* verse: English left, Chinese right */
.docbody .unit{margin:0 0 30px}
.docbody table.verse{width:100%;border-collapse:collapse;margin:0}
.docbody table.verse td{vertical-align:top;padding:2px 0;width:50%;font-size:16.5px;line-height:1.62}
.docbody table.verse td.en{padding-right:28px}
.docbody table.verse td.zh{padding-left:calc(28px + var(--ind,0em));border-left:1px solid var(--rule-soft);color:var(--zh-ink);font-size:15.5px}
.docbody .notes{margin-top:12px;padding:14px 18px;background:var(--panel);border:1px solid var(--rule-soft);border-radius:12px}
.docbody .nh{font-family:var(--f-ui);font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.docbody .nt{margin:0 0 8px;font-size:14px;line-height:1.7}
.docbody .ph{font-style:italic;color:var(--ink)}
.docbody .ph::after{content:" — ";font-style:normal;color:var(--muted)}
.docbody .nb{color:var(--ink-2)}

/* journal entries */
.docbody h3.mon{font-family:var(--f-ui);font-size:11.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);
  margin:52px 0 12px;padding-bottom:10px;border-bottom:1px solid var(--rule)}
.docbody .entry{display:grid;grid-template-columns:128px minmax(0,1fr);gap:4px 24px;padding:12px 0;border-bottom:1px solid var(--rule-soft)}
.docbody .entry .date{grid-column:1;grid-row:1;font-family:var(--f-ui);font-weight:600;font-size:13px;font-variant-numeric:tabular-nums}
.docbody .entry .wx{grid-column:1;grid-row:2;font-family:var(--f-ui);font-size:11.5px;color:var(--muted);line-height:1.5}
.docbody .entry .obs{grid-column:2;grid-row:1 / span 2;font-size:15.5px}
.docbody .entry.cont{border-bottom:0;padding-top:0}

/* ---------- outline rail ---------- */
.toc{position:sticky;top:calc(var(--bar-h) + 40px);align-self:start;max-height:calc(100vh - var(--bar-h) - 72px);display:flex;flex-direction:column;
  padding:0 28px 0 0;margin-top:64px}
.toc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.toc-title{font-family:var(--f-ui);font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.toc-head .icon-btn{width:28px;height:28px}
.toc-head .icon-btn .ic{width:15px;height:15px}
.toc-list{overflow-y:auto;display:flex;flex-direction:column;border-left:1px solid var(--rule)}
.toc-link{background:none;border:0;text-align:left;cursor:pointer;padding:6px 0 6px 14px;margin-left:-1px;border-left:1px solid transparent;
  font-family:var(--f-ui);font-size:12.5px;line-height:1.45;color:var(--muted);transition:color .15s,border-color .15s}
.toc-link:hover{color:var(--ink)}
.toc-link.lv2{padding-left:26px;font-size:12px}
.toc-link.on{color:var(--ink);border-left-color:var(--ink)}

/* ---------- menus & dialogs ---------- */
.pop{animation:pop-in .18s var(--ease);transform-origin:top left;position:absolute;z-index:60;min-width:168px;background:var(--surface);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;padding:6px}
@keyframes pop-in{from{opacity:0;transform:translateY(-4px) scale(.97)}}
.pop.out{animation:pop-out .12s ease forwards}
@keyframes pop-out{to{opacity:0;transform:translateY(-3px) scale(.98)}}
.pop-item{background:none;border:0;text-align:left;padding:8px 12px;border-radius:8px;font-family:var(--f-ui);font-size:13px;cursor:pointer;color:var(--ink)}
.pop-item:hover{background:var(--rule-soft)}
.pop-item.danger{color:var(--danger)}
.mroot{position:fixed;inset:0;z-index:80;background:var(--scrim);display:flex;align-items:flex-start;justify-content:center;
  padding:10vh 16px 40px;overflow-y:auto;backdrop-filter:blur(3px)}
.mroot[hidden]{display:none}
.mbox{background:var(--surface);border:1px solid var(--rule);border-radius:16px;width:min(560px,100%);box-shadow:var(--shadow)}
.mform{display:flex;flex-direction:column;gap:18px;padding:28px}
.mtitle{margin:0;font-family:var(--f-read);font-size:22px;font-weight:500;letter-spacing:-.01em}
.field{display:flex;flex-direction:column;gap:7px}
.checkfield{flex-direction:row;align-items:center;gap:10px}
.flabel,.flabel-inline{font-family:var(--f-ui);font-size:12px;font-weight:500;color:var(--ink-2)}
.finput{font-family:var(--f-ui);font-size:14px;padding:10px 12px;border:1px solid var(--rule);border-radius:10px;background:var(--bg);color:var(--ink);width:100%}
.finput:focus{outline:none;border-color:var(--ink-2);background:var(--surface)}
textarea.finput{resize:vertical;line-height:1.55}
.fcheck{width:16px;height:16px;accent-color:var(--accent)}
.fhint{margin:0;font-family:var(--f-ui);font-size:12px;color:var(--muted);line-height:1.55}
.ferr{margin:0;font-family:var(--f-ui);font-size:12.5px;color:var(--danger)}
.mrow{display:flex;justify-content:flex-end;gap:10px;padding-top:4px}
.btn{font-family:var(--f-ui);font-size:13.5px;font-weight:500;padding:9px 18px;border-radius:10px;border:1px solid var(--rule);cursor:pointer}
.btn.ghost{background:none;color:var(--ink-2)}
.btn.ghost:hover{background:var(--rule-soft);color:var(--ink)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.primary:hover{opacity:.9}

/* ---------- language toggle ---------- */
body.only-en .docbody p.zh,body.only-en .docbody td.zh,body.only-en .docbody .zh:not(.dz):not(.ni-z),
body.only-en .docbody .nt,body.only-en .docbody .notes,body.only-en .docbody .ap{display:none}
body.only-en .docbody td.en{width:100%;padding-right:0}
body.only-zh .docbody p.en,body.only-zh .docbody td.en,body.only-zh .docbody figcaption .en,body.only-zh .docbody .ph{display:none}
body.only-zh .docbody td.zh{width:100%;padding-left:var(--ind,0em);border-left:0}

/* ---------- annotations ---------- */
:root{--hl-y:rgba(233,196,92,.42);--hl-g:rgba(132,170,128,.34);--hl-b:rgba(118,158,206,.32);--hl-r:rgba(214,132,124,.32);--tts:rgba(44,62,53,.11);--tts-line:rgba(44,62,53,.55)}
:root[data-theme="dark"]{--thumb:#2C322F;--hl-y:rgba(222,184,84,.30);--hl-g:rgba(132,176,128,.28);--hl-b:rgba(120,160,214,.28);--hl-r:rgba(222,132,124,.28);--tts:rgba(195,211,201,.14);--tts-line:rgba(195,211,201,.6)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--thumb:#2C322F;--hl-y:rgba(222,184,84,.30);--hl-g:rgba(132,176,128,.28);--hl-b:rgba(120,160,214,.28);--hl-r:rgba(222,132,124,.28);--tts:rgba(195,211,201,.14);--tts-line:rgba(195,211,201,.6)}}
.docbody mark.an{color:inherit;border-radius:2px;padding:.06em 0;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.docbody mark.an.c-y{background:var(--hl-y)} .docbody mark.an.c-g{background:var(--hl-g)}
.docbody mark.an.c-b{background:var(--hl-b)} .docbody mark.an.c-r{background:var(--hl-r)}
.docbody .an-u{text-decoration:underline;text-decoration-color:var(--ink-2);text-decoration-thickness:1.5px;text-underline-offset:.22em}
.docbody .an-b{font-weight:600}
.docbody .zh .an-b,.docbody p.zh .an-b,.docbody td.zh .an-b{font-weight:700}
::highlight(tts){background-color:var(--tts)}
.docbody .tts-fallback{background:var(--tts);border-radius:4px}

.selbar{position:absolute;z-index:70;display:flex;align-items:center;gap:2px;padding:5px;background:var(--surface);border:1px solid var(--rule);
  border-radius:12px;box-shadow:var(--shadow);animation:pop-in .16s var(--ease);font-family:var(--f-ui);user-select:none;-webkit-user-select:none}
.selbar[hidden]{display:none}
.selbar button{display:inline-grid;place-items:center;height:32px;min-width:32px;padding:0 8px;border:0;border-radius:8px;background:none;color:var(--ink-2);cursor:pointer;
  font-family:var(--f-ui);font-size:12.5px;font-weight:500;transition:background .15s,color .15s}
.selbar button:hover{background:var(--rule-soft);color:var(--ink)}
.selbar button.on{background:var(--accent-soft);color:var(--accent)}
.selbar button .ic{width:17px;height:17px}
.selbar .sw{padding:0;width:30px;min-width:30px}
.selbar .sw::before{content:"";width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.selbar .sw.c-y::before{background:var(--hl-y)} .selbar .sw.c-g::before{background:var(--hl-g)}
.selbar .sw.c-b::before{background:var(--hl-b)} .selbar .sw.c-r::before{background:var(--hl-r)}
.selbar .sw.on{background:none}.selbar .sw.on::before{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--ink-2)}
.selbar .rd{gap:6px;display:inline-flex;align-items:center;padding:0 10px 0 8px}
.sb-sep{width:1px;height:18px;background:var(--rule);margin:0 4px}

/* ---------- listening player ---------- */
body.tts-open .doc{padding-bottom:220px}
.player{position:fixed;z-index:45;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  width:min(680px,calc(100vw - 32px));background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:saturate(1.2) blur(18px);-webkit-backdrop-filter:saturate(1.2) blur(18px);
  border:1px solid var(--rule);border-radius:18px;box-shadow:var(--shadow);padding:12px 14px 12px;display:flex;flex-direction:column;gap:10px;font-family:var(--f-ui);
  animation:pl-in .3s var(--ease)}
.player[hidden]{display:none}
.player.out{animation:pl-out .2s ease forwards}
@keyframes pl-in{from{opacity:0;transform:translate(-50%,14px)}}
@keyframes pl-out{to{opacity:0;transform:translate(-50%,10px)}}
@media (min-width:901px){.shell:not(.side-closed) ~ .player{left:calc(50% + var(--side-w) / 2);width:min(680px,calc(100vw - var(--side-w) - 48px))}}
.pl-row{display:flex;align-items:center;gap:12px;min-width:0}
.pl-ctrl{display:flex;align-items:center;gap:4px}
.pl-play{width:42px;height:42px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);display:grid;place-items:center;cursor:pointer;transition:transform .15s var(--ease),opacity .15s}
.pl-play:hover{opacity:.9}.pl-play:active{transform:scale(.95)}
.pl-play .ic{width:18px;height:18px}
.pl-play .ic.fill{fill:currentColor;stroke:none}
.pl-meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.pl-top{display:flex;align-items:baseline;gap:12px;min-width:0}
.pl-t{flex:1;min-width:0;font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-time{flex:none;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.01em;white-space:nowrap}
.pl-time b{font-weight:500;color:var(--ink-2)}
.pl-bar{position:relative;height:4px;border-radius:4px;background:var(--rule);cursor:pointer}
.pl-bar::before{content:"";position:absolute;inset:-8px 0}
.pl-bar span{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--ink-2);width:0;transition:width .5s linear}
.pl-opts{gap:10px;flex-wrap:wrap;padding-top:10px;border-top:1px solid var(--rule-soft)}
.pl-sel{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);min-width:0;white-space:nowrap}
.pl-sel select{font-family:var(--f-ui);font-size:12.5px;color:var(--ink);background:var(--rule-soft);border:0;border-radius:8px;height:30px;padding:0 26px 0 10px;
  appearance:none;-webkit-appearance:none;cursor:pointer;min-width:0;max-width:220px;text-overflow:ellipsis;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 13px) 13px,calc(100% - 9px) 13px;background-size:4px 4px;background-repeat:no-repeat}
.pl-sel.voice{flex:1}
.pl-sel.voice select{width:100%;max-width:none}
.pl-note{font-size:12px;color:var(--muted);margin:0;line-height:1.5}
.pl-note[hidden]{display:none}
@media (max-width:560px){
  .player{padding:10px 12px;gap:8px;border-radius:16px;bottom:calc(10px + env(safe-area-inset-bottom,0px));width:calc(100vw - 20px)}
  .pl-opts{padding-top:8px}
  .pl-sel.voice{flex-basis:100%;order:3}
  .pl-sel span{display:none}
  .pl-sel.voice span{display:inline}
}

/* ---------- motion system: every control responds ---------- */
.icon-btn,.btn,.ghost-btn,.navitem,.pop-item,.f-toggle,.toc-link,.seg button,.selbar button,.pl-sel select{transition-property:background-color,color,border-color,box-shadow,opacity,transform;transition-duration:.18s;transition-timing-function:var(--ease)}
.icon-btn:active,.selbar button:active{transform:scale(.9)}
.btn:active,.ghost-btn:active{transform:scale(.97)}
.navitem:active{transform:scale(.985)}
.pop-item:active{transform:scale(.98)}
.seg button:active{transform:scale(.94)}
.f-toggle:active .chev{transform:scale(.85)}
.folder.closed .f-toggle:active .chev{transform:rotate(-90deg) scale(.85)}
.finput{transition:border-color .18s var(--ease),background-color .18s var(--ease),box-shadow .18s var(--ease)}
.finput:focus{box-shadow:0 0 0 3px var(--accent-soft)}
#sidetoggle .ic,#sideclose .ic{transition:transform .3s var(--ease)}

/* segmented controls: a sliding thumb instead of a jump */
.seg{position:relative;isolation:isolate}
.seg-thumb{position:absolute;z-index:-1;top:3px;bottom:3px;left:0;width:0;border-radius:8px;background:var(--thumb,var(--surface));box-shadow:0 1px 2px rgba(0,0,0,.08),0 1px 6px rgba(0,0,0,.04);
  transition:transform .32s var(--ease),width .32s var(--ease),opacity .2s;pointer-events:none;opacity:0}
.seg.ready .seg-thumb{opacity:1}
.seg.ready button.on{background:transparent;box-shadow:none}
.seg.instant .seg-thumb{transition:none}
.seg.icons button .ic{transition:transform .45s var(--ease)}
.seg.icons button.on .ic{animation:icon-turn .5s var(--ease)}
@keyframes icon-turn{from{transform:rotate(-70deg) scale(.7);opacity:.4}}

/* theme change cross-fades instead of snapping */
html.theming,html.theming *,html.theming *::before,html.theming *::after{transition:background-color .38s ease,color .38s ease,border-color .38s ease,box-shadow .38s ease!important}

/* sidebar collapse on desktop slides */
@media (min-width:901px){
  .shell{transition:grid-template-columns .36s var(--ease)}
  .side{min-width:var(--side-w);transition:transform .36s var(--ease),visibility 0s}
  .shell.side-closed .side{transform:translateX(-100%);transition:transform .36s var(--ease),visibility 0s .36s}
}
.scrim:not([hidden]){animation:fade-in .28s ease}

/* documents, outline, language */
.doc:not([hidden]){animation:doc-in .42s var(--ease)}
@keyframes doc-in{from{opacity:0;transform:translateY(8px)}}
.toc:not([hidden]){animation:fade-in .3s ease}
@keyframes fade-in{from{opacity:0}}
.docbody.lang-fade{animation:fade-in .32s ease}
.toc-link{transition:color .2s,border-color .25s var(--ease),padding .2s var(--ease)}
.toc-link:hover{padding-left:17px}.toc-link.lv2:hover{padding-left:29px}

/* dialogs */
.mroot:not([hidden]){animation:fade-in .22s ease}
.mroot:not([hidden]) .mbox{animation:dlg-in .3s var(--ease)}
@keyframes dlg-in{from{opacity:0;transform:translateY(10px) scale(.97)}}
.mroot.closing{animation:fade-out .18s ease forwards}
.mroot.closing .mbox{animation:dlg-out .18s ease forwards}
@keyframes fade-out{to{opacity:0}}
@keyframes dlg-out{to{opacity:0;transform:translateY(6px) scale(.98)}}

/* player button swaps icon with a small pop */
.pl-play.swap .ic{animation:icon-pop .28s var(--ease)}
@keyframes icon-pop{from{transform:scale(.6);opacity:.3}}
#ttsopen.on{background:var(--accent-soft);color:var(--accent)}

/* ---------- voice pack manager ---------- */
.mbox.vp-box{width:min(680px,100%)}
.vp{display:flex;flex-direction:column;gap:22px;padding:26px 28px 24px;font-family:var(--f-ui)}
.vp-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.vp-head .mtitle{margin:0}
.vp-sub{margin:6px 0 0;font-size:12.5px;line-height:1.6;color:var(--muted)}
#vpbody{display:flex;flex-direction:column;gap:24px}
.vp-sec{display:flex;flex-direction:column}
.vp-h{font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding-bottom:8px;border-bottom:1px solid var(--rule)}
.vp-row{display:flex;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--rule-soft)}
.vp-row:last-child{border-bottom:0}
.vp-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.vp-name{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13.5px;font-weight:500;color:var(--ink)}
.vp-desc{font-size:12px;color:var(--muted);line-height:1.5}
.vp-chip{font-size:10.5px;font-weight:500;letter-spacing:.02em;padding:2px 8px;border-radius:999px;border:1px solid var(--rule);color:var(--muted);line-height:1.5}
.vp-chip.ok{border-color:transparent;background:var(--accent-soft);color:var(--accent)}
.vp-chip.run{border-color:transparent;background:var(--rule-soft);color:var(--ink-2)}
.vp-chip.err{border-color:transparent;background:color-mix(in srgb,var(--danger) 12%,transparent);color:var(--danger)}
.vp-chip.cur{border-color:var(--ink-2);color:var(--ink-2)}
.vp-prog{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.vp-bar{height:4px;border-radius:4px;background:var(--rule);overflow:hidden}
.vp-bar span{display:block;height:100%;border-radius:4px;background:var(--accent);width:0;transition:width .3s var(--ease)}
.vp-meta{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.vp-act{display:flex;align-items:center;gap:6px;flex:none}
.vp-btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:8px;border:1px solid var(--rule);background:none;color:var(--ink-2);
  font-family:var(--f-ui);font-size:12.5px;font-weight:500;cursor:pointer;transition:background-color .18s var(--ease),color .18s,border-color .18s,transform .18s var(--ease)}
.vp-btn:hover{background:var(--rule-soft);color:var(--ink)}
.vp-btn:active{transform:scale(.96)}
.vp-btn.primary{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.vp-btn.primary:hover{opacity:.9;background:var(--ink)}
.vp-btn.icon{width:30px;padding:0;justify-content:center}
.vp-btn .ic{width:15px;height:15px}
.vp-btn[disabled]{opacity:.45;pointer-events:none}
.vp-foot{display:flex;flex-direction:column;gap:12px;padding:16px 18px;border-radius:12px;background:var(--panel);border:1px solid var(--rule-soft)}
.vp-store{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12.5px;color:var(--ink-2)}
.vp-store .vp-bar{flex:1;max-width:220px}
.vp-line{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.vp-check{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);cursor:pointer}
.vp-check input{accent-color:var(--accent);width:15px;height:15px}
.vp-foot .vp-act{gap:8px}
@media (max-width:560px){
  .vp{padding:22px 18px 20px;gap:18px}
  .vp-row{flex-wrap:wrap;gap:10px}
  .vp-act{width:100%;justify-content:flex-end}
}

/* ---------- responsive ---------- */
@media (max-width:1240px){ .reading{grid-template-columns:minmax(0,1fr)} .toc{display:none!important} #tocopen{display:none!important} }
@media (max-width:900px){
  .shell,.shell.side-closed{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;height:auto;z-index:50;width:min(320px,86vw);transform:translateX(-100%);
    transition:transform .28s cubic-bezier(.2,.7,.2,1);box-shadow:none;padding-top:calc(22px + env(safe-area-inset-top,0px));visibility:visible!important}
  .shell.drawer-open .side{transform:none;box-shadow:var(--shadow)}
  .toolbar{padding:0 16px 0 10px;gap:8px}
  .tb-group{gap:8px}
  .doc{padding:40px 16px 110px}
  .dochead{padding-bottom:28px;margin-bottom:32px}
  .docbody{font-size:17px}
  .docbody h2{font-size:22px;margin:56px 0 22px}
  .docbody .src{padding:16px}
  .docbody table.verse td{display:block;width:100%;padding:0}
  .docbody table.verse td.en{padding-right:0}
  .docbody table.verse td.zh{padding-left:var(--ind,0em);border-left:0;color:var(--ink-2);padding-bottom:10px;font-size:14.5px}
  .docbody .entry{grid-template-columns:1fr;gap:2px}
  .docbody .entry .date,.docbody .entry .wx,.docbody .entry .obs{grid-column:1;grid-row:auto}
  .row-btn{opacity:1}
}
@media (min-width:901px){ .scrim{display:none} }
@media (max-width:420px){ .seg button{padding:0 8px;min-width:30px} .seg.icons button{width:30px;min-width:30px} .tb-sep{display:none} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* ---------- PDF upload ---------- */
.pdfstat{margin:-8px 0 30px;padding:14px 16px;border:1px solid var(--rule);border-radius:12px;background:var(--panel);font-family:var(--f-ui);animation:fade-in .3s var(--ease)}
.ps-row{display:flex;align-items:center;gap:10px;min-height:30px}
.ps-t{flex:1;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.ps-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none;animation:ps-pulse 1.4s ease-in-out infinite}
.ps-dot.idle{animation:none;background:var(--muted)}
@keyframes ps-pulse{50%{opacity:.35;transform:scale(.8)}}
.ps-bar{margin-top:10px}
.ps-err{margin:10px 0 0;font-size:12.5px;color:var(--muted);line-height:1.6}
.btn.sm{padding:6px 12px;font-size:12.5px}
.docbody p.zh.pend{min-height:1.4em;border-radius:6px;background:var(--rule-soft)}
.docbody p.zh.pend.act{background:linear-gradient(90deg,var(--rule-soft) 0%,var(--rule) 50%,var(--rule-soft) 100%);background-size:200% 100%;animation:pend-sh 1.4s linear infinite}
.docbody h2 .zh.pend.act{display:inline-block;min-width:6em;min-height:1em;border-radius:4px;background:var(--rule);animation:pend-sh 1.4s linear infinite}
@keyframes pend-sh{from{background-position:200% 0}to{background-position:-200% 0}}
.docbody .zh.fresh{animation:fade-in .6s var(--ease)}
@media (prefers-reduced-motion:reduce){.docbody p.zh.pend.act,.ps-dot{animation:none}}
#nav.drop{outline:2px dashed var(--accent);outline-offset:-6px;border-radius:12px}
.ghost-btn.prime{border-color:var(--ink-2);color:var(--ink)}

/* ---------- drag to reorder ---------- */
.navitem[draggable="true"]{cursor:grab}
.f-list li.dragging{opacity:.4}
.f-list li.drop-before::before,.f-list li.drop-after::after{content:"";position:absolute;left:8px;right:8px;height:2px;border-radius:2px;background:var(--accent);pointer-events:none}
.f-list li.drop-before::before{top:-2px}
.f-list li.drop-after::after{bottom:-2px}
.folder.drop-into>.f-head{background:var(--accent-soft);border-radius:8px}
.folder.drop-into .f-empty{color:var(--ink-2)}
.pop-item.dim{color:var(--muted)}
.btn.primary.danger{background:var(--danger);border-color:var(--danger);color:var(--bg)}
/* ---------- sidebar tools ---------- */
.nav-tools{display:flex;flex-direction:column;gap:2px;margin:0 0 4px;padding-bottom:12px;border-bottom:1px solid var(--rule-soft)}
.sbox{display:flex;align-items:center;gap:8px;margin:0 0 8px;padding:0 10px;height:36px;border:1px solid var(--rule);border-radius:10px;background:var(--surface);color:var(--muted);transition:border-color .15s,box-shadow .15s}
.sbox:focus-within{border-color:var(--ink-2);box-shadow:0 0 0 3px var(--accent-soft)}
.sbox .ic{width:15px;height:15px;flex:none}
.sbox input{flex:1;min-width:0;border:0;outline:0;background:none;font-family:var(--f-ui);font-size:13px;color:var(--ink)}
.sbox input::placeholder{color:var(--muted)}
.tool-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;border-radius:9px;background:none;color:var(--ink-2);font-family:var(--f-ui);font-size:13px;cursor:pointer;text-align:left;transition:background .15s,color .15s}
.tool-item .ic{width:16px;height:16px}
.tool-item:hover{background:var(--rule-soft);color:var(--ink)}
.tool-item.on{background:var(--accent-soft);color:var(--accent);font-weight:500}
.ti-n{margin-left:auto;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.ni-p{display:block;height:2px;margin-top:6px;border-radius:2px;background:var(--rule);overflow:hidden;max-width:120px}
.ni-p span{display:block;height:100%;background:var(--ink-2);opacity:.55;border-radius:2px}
.ni-p.done span{background:var(--accent);opacity:1}
/* ---------- doc header actions ---------- */
.doc-actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-top:4px;font-family:var(--f-ui);font-size:12px;color:var(--muted)}
.doc-actions .btn{display:inline-flex;align-items:center;gap:6px}
.doc-actions .btn .ic{width:15px;height:15px}
.da-lec,.da-prog{font-variant-numeric:tabular-nums}
.doc-end{display:flex;align-items:center;justify-content:center;gap:14px;margin:72px 0 24px;padding-top:28px;border-top:1px solid var(--rule);font-family:var(--f-ui);font-size:13px;color:var(--muted)}
.doc-loading{padding:80px 0;text-align:center}
/* ---------- study card ---------- */
.study{margin:-8px 0 44px;padding:26px 28px 22px;border:1px solid var(--rule);border-radius:16px;background:var(--panel);font-family:var(--f-ui);animation:fade-in .3s var(--ease)}
.st-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.st-title{margin:0;font-family:var(--f-read);font-size:24px;font-weight:500;letter-spacing:-.01em}
.st-title .zh{display:block;font-family:var(--f-zh);font-size:13px;color:var(--muted);margin-top:4px;font-weight:400}
.st-act{display:flex;gap:6px;flex-wrap:wrap}
.st-msg{display:flex;align-items:center;gap:10px;margin:14px 0 4px;font-size:13.5px;color:var(--ink-2)}
.st-block{margin-top:22px}
.st-block h3{margin:0 0 10px;font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.st-thesis{margin:0;font-family:var(--f-read);font-size:19px;line-height:1.55;color:var(--ink)}
.st-zh{font-family:var(--f-zh);color:var(--zh-ink);font-size:14px}
p.st-zh{margin:8px 0 0;line-height:1.75}
.st-args,.st-qs{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:9px;font-family:var(--f-read);font-size:16px;line-height:1.55;color:var(--ink)}
.st-pg{font-family:var(--f-ui);font-size:11px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.st-terms{margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.st-terms>div{padding:12px 14px;border:1px solid var(--rule-soft);border-radius:10px;background:var(--surface)}
.st-terms dt{font-weight:600;font-size:13.5px;color:var(--ink)}
.st-terms dd{margin:5px 0 0;font-size:13px;line-height:1.55;color:var(--ink-2)}
.st-quotes,.st-links{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
.st-links li{font-family:var(--f-read);font-size:15.5px;line-height:1.55;color:var(--ink);padding-left:14px;position:relative}
.st-links li::before{content:"";position:absolute;left:0;top:.7em;width:5px;height:5px;border-radius:50%;background:var(--muted)}
.st-quotes li{padding-left:14px;border-left:2px solid var(--rule)}
.st-q{display:inline;padding:0;border:0;background:none;text-align:left;cursor:pointer;font-family:var(--f-read);font-size:16px;line-height:1.55;font-style:italic;color:var(--ink)}
.st-q:hover{text-decoration:underline;text-decoration-color:var(--muted);text-underline-offset:.2em}
.st-why{display:block;margin-top:4px;font-size:12.5px;line-height:1.5;color:var(--muted)}
.st-warn{font-size:11px;color:var(--danger)}
.st-meta{margin:22px 0 0;font-size:11.5px;color:var(--muted)}
.flash{animation:flash 2s var(--ease)}
@keyframes flash{0%,30%{background:var(--accent-soft);box-shadow:0 0 0 8px var(--accent-soft)}100%{background:transparent;box-shadow:0 0 0 8px transparent}}
/* ---------- selection toolbar (AI row) ---------- */
.selbar{flex-wrap:wrap;max-width:min(470px,calc(100vw - 16px))}
.sb-break{flex-basis:100%;height:1px;margin:3px 2px;background:var(--rule-soft)}
.selbar .sb-ai{display:inline-flex;align-items:center;gap:5px;padding:0 9px 0 7px}
.selbar .sb-ai[hidden]{display:none}
.docbody .an-n{text-decoration:underline dotted;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:.24em;cursor:help}
.docbody .an-n:hover{background:var(--accent-soft)}
/* ---------- floating AI card ---------- */
.aicard{position:fixed;z-index:90;display:flex;flex-direction:column;max-height:min(70vh,560px);background:var(--surface);border:1px solid var(--rule);border-radius:14px;box-shadow:var(--shadow);font-family:var(--f-ui);animation:dlg-in .2s var(--ease)}
.aicard.out{animation:fade-out .18s ease forwards}
.aicard.sheet{left:8px!important;right:8px;bottom:8px;top:auto!important;width:auto!important;max-height:62vh}
.ai-head{display:flex;align-items:center;gap:8px;padding:10px 10px 6px 16px}
.ai-title{flex:1;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.ai-body{padding:4px 16px 12px;overflow:auto;font-size:14px;line-height:1.65;color:var(--ink)}
.ai-body p{margin:0 0 8px}
.ai-body h4{margin:10px 0 4px;font-size:12px;letter-spacing:.06em;color:var(--ink-2)}
.ai-body ul,.ai-body ol{margin:0 0 8px;padding-left:1.2em}
.ai-body b{font-weight:600}
.ai-wait{display:flex;align-items:center;gap:8px;color:var(--muted)}
.ai-err{color:var(--danger);font-size:12.5px}
.ai-foot{display:flex;gap:8px;flex-wrap:wrap;padding:10px 14px 12px;border-top:1px solid var(--rule-soft)}
.ai-foot:empty{display:none}
.cite-label{margin:6px 0 4px!important;font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.cite-box{padding:10px 12px;border-radius:9px;background:var(--panel);border:1px solid var(--rule-soft);font-family:var(--f-read);font-size:15px;line-height:1.55;user-select:all}
.note-q{margin:0 0 10px;padding-left:12px;border-left:2px solid var(--rule);font-family:var(--f-read);color:var(--ink-2);font-style:italic}
.note-t{white-space:pre-wrap}
.vc-head{display:flex;align-items:baseline;flex-wrap:wrap;gap:10px;margin-bottom:6px}
.vc-w{font-family:var(--f-read);font-size:24px;font-weight:500}
.vc-ipa{color:var(--muted);font-size:13px}
.vc-pos{font-size:11px;padding:2px 7px;border-radius:999px;border:1px solid var(--rule);color:var(--ink-2)}
.vc-zh{font-family:var(--f-zh);font-size:15.5px;color:var(--ink)}
.vc-def{color:var(--ink-2)}
.vc-note{font-size:12.5px;color:var(--muted)}
.vc-ex{padding:8px 10px;border-radius:8px;background:var(--panel);font-family:var(--f-read);font-size:14.5px;color:var(--ink-2)}
.vc-ex b{color:var(--ink);font-weight:600}
.toast{position:fixed;left:50%;bottom:28px;z-index:120;transform:translateX(-50%);padding:10px 16px;border-radius:10px;background:var(--ink);color:var(--bg);font-family:var(--f-ui);font-size:13px;box-shadow:var(--shadow);animation:pl-in .2s var(--ease)}
.toast.out{animation:fade-out .2s ease forwards}
/* ---------- paragraph tools ---------- */
.docbody [data-pi]{position:relative}
.pt-btn{position:absolute;right:-40px;top:0;opacity:.5;width:30px;height:30px}
.pt-btn:hover{opacity:1}
@media (max-width:900px){.pt-btn{right:-4px;top:-30px}}
/* ---------- views ---------- */
.v-steps{margin:0 0 8px;padding-left:1.3em;display:flex;flex-direction:column;gap:12px;font-family:var(--f-ui);font-size:14.5px;line-height:1.6;color:var(--ink-2)}
.v-steps b{color:var(--ink);font-weight:600}
.v-steps .btn{margin-left:6px}
.vbody h2 .zh{display:block;margin-top:6px;font-size:14px}
.v-empty,.v-src,.v-stat{font-family:var(--f-ui);font-size:13.5px;color:var(--muted);line-height:1.7}
.v-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 8px;font-family:var(--f-ui)}
.v-sp{flex:1}
.v-ok{font-size:12.5px;color:var(--muted)}
.v-tip{margin:22px 0 0}
.lec{margin:0 0 14px;padding:16px 18px;border:1px solid var(--rule);border-radius:14px;background:var(--surface);font-family:var(--f-ui)}
.lec.today{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.lec.past{opacity:.72}
.lec.exam{background:var(--panel)}
.lec-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.lec-d{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:52px}
.lec-t{flex:1;font-size:15px;font-weight:500;color:var(--ink)}
.lec-sl,.lec-ext,.sch-sl{font-size:12px;color:var(--ink-2);text-decoration:none;border-bottom:1px solid var(--rule)}
.lec-sl:hover,.lec-ext:hover,.sch-sl:hover{color:var(--ink);border-color:var(--ink-2)}
.lec-r{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.lec-r li{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-top:8px;border-top:1px solid var(--rule-soft)}
.lr-t{flex:1;min-width:220px;font-family:var(--f-read);font-size:15.5px;line-height:1.45;color:var(--ink)}
.lec-r li.opt .lr-t{color:var(--ink-2)}
.lr-a{font-family:var(--f-ui);font-size:12px;color:var(--muted)}
.star{color:var(--accent);margin-right:3px}
.lr-act{display:flex;align-items:center;gap:8px}
.lec-none{margin:8px 0 0;font-size:12.5px;color:var(--muted)}
.v-doc{display:inline-flex;align-items:center;gap:10px;padding:7px 12px;border:1px solid var(--rule);border-radius:9px;background:none;color:var(--ink);font-family:var(--f-ui);font-size:12.5px;cursor:pointer;transition:border-color .15s,background .15s}
.v-doc:hover{border-color:var(--ink-2);background:var(--panel)}
.v-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.v-list .v-doc{width:100%;justify-content:space-between;padding:12px 14px}
.v-t{text-align:left;flex:1;font-size:13px}
.pbar{display:inline-block;width:56px;height:4px;border-radius:4px;background:var(--rule);overflow:hidden;vertical-align:middle}
.pbar span{display:block;height:100%;background:var(--accent)}
.pnum{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:34px}
.sched{display:flex;flex-direction:column;font-family:var(--f-ui)}
.sch-w{margin:22px 0 6px;font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.sch-w.past{opacity:.6}
.sch-row{display:flex;align-items:baseline;gap:12px;padding:8px 2px;border-bottom:1px solid var(--rule-soft)}
.sch-row.past{opacity:.6}
.sch-row.today{background:var(--accent-soft);border-radius:8px;padding:8px}
.sch-row.exam .sch-t{color:var(--danger);font-weight:500}
.sch-d{width:44px;flex:none;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.sch-t{flex:1;font-size:13.5px;color:var(--ink)}
.sch-r{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.sch-a{display:flex;gap:6px;align-items:center}
.sch-doc{padding:3px 8px;border:1px solid var(--rule);border-radius:999px;background:none;font-family:var(--f-ui);font-size:11px;color:var(--ink-2);cursor:pointer}
.sch-doc.done{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.n-list,.s-list,.vc-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.n-go,.s-go{display:flex;flex-direction:column;gap:6px;width:100%;padding:12px 14px;border:1px solid var(--rule-soft);border-radius:11px;background:var(--surface);text-align:left;cursor:pointer;transition:border-color .15s}
.n-go:hover,.s-go:hover{border-color:var(--ink-2)}
.n-tag{font-family:var(--f-ui);font-size:10.5px;font-weight:600;letter-spacing:.1em;color:var(--muted)}
.n-x,.s-snip{font-family:var(--f-read);font-size:15.5px;line-height:1.55;color:var(--ink)}
.n-item.t-h .n-x{padding:0 .15em;border-radius:3px}
.n-item.t-h.c-y .n-x{background:var(--hl-y)} .n-item.t-h.c-g .n-x{background:var(--hl-g)} .n-item.t-h.c-b .n-x{background:var(--hl-b)} .n-item.t-h.c-r .n-x{background:var(--hl-r)}
.n-item.t-u .n-x{text-decoration:underline;text-underline-offset:.2em}
.n-item.t-b .n-x{font-weight:600}
.n-note{font-family:var(--f-ui);font-size:13px;line-height:1.6;color:var(--accent);padding:8px 10px;border-radius:8px;background:var(--accent-soft);white-space:pre-wrap}
mark.s-hit{background:var(--hl-y);color:inherit;border-radius:2px}
.s-more{font-family:var(--f-ui);font-size:12px;color:var(--muted);padding-left:4px}
.vc-list li{padding:14px 16px;border:1px solid var(--rule-soft);border-radius:12px;background:var(--surface);font-family:var(--f-ui)}
.vl-main{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.vl-w{font-family:var(--f-read);font-size:20px;font-weight:500}
.vl-ipa{font-size:12.5px;color:var(--muted)}
.vl-pos{font-size:11px;color:var(--ink-2)}
.vl-zh{font-family:var(--f-zh);font-size:14.5px;color:var(--ink)}
.vl-def{margin:6px 0 0;font-size:13px;color:var(--ink-2);line-height:1.55}
.vl-ex{margin:6px 0 0;font-family:var(--f-read);font-size:14px;color:var(--muted);line-height:1.5}
.vl-foot{display:flex;align-items:center;gap:12px;margin-top:10px;font-size:11.5px;color:var(--muted)}
.vl-src,.vl-del{padding:0;border:0;background:none;font-family:var(--f-ui);font-size:11.5px;color:var(--ink-2);cursor:pointer;text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:.2em}
.vl-del{margin-left:auto;color:var(--muted)}
.rv-card{margin:6px 0 24px;padding:34px 30px;border:1px solid var(--rule);border-radius:18px;background:var(--surface);text-align:center;font-family:var(--f-ui);animation:fade-in .25s var(--ease)}
.rv-n{margin:0;font-size:11px;color:var(--muted);letter-spacing:.1em}
.rv-w{margin:12px 0 10px;font-family:var(--f-read);font-size:34px;font-weight:500}
.rv-ex{margin:0 auto 16px;max-width:520px;font-family:var(--f-read);font-size:16px;color:var(--ink-2);line-height:1.55}
.rv-ex b{color:var(--ink)}
.rv-ans{margin:0 0 16px}
.rv-ipa{margin:0;color:var(--muted);font-size:13px}
.rv-zh{margin:8px 0 4px;font-family:var(--f-zh);font-size:18px}
.rv-def{margin:0;color:var(--ink-2);font-size:14px}
.rv-btns{display:flex;justify-content:center;gap:10px}
.rv-s{color:var(--muted)}
@media (max-width:900px){.study{padding:20px 18px}.st-thesis{font-size:17px}.lr-t{min-width:0}}
.vc-list[hidden],.n-list[hidden]{display:none}
.docbody.vbody ul.n-list,.docbody.vbody ul.s-list,.docbody.vbody ul.vc-list,.docbody.vbody ul.v-list,.docbody.vbody ul.lec-r{margin-left:0;padding-left:0}
.docbody p.sep{margin:44px 0;text-align:center;line-height:1}
.docbody p.sep::before{content:"* * *";letter-spacing:.6em;color:var(--muted);font-family:var(--f-ui);font-size:14px}

/* ---------- sidebar footer: one "new" button, account, more ---------- */
.side{gap:20px;padding-bottom:0}
.side-foot{position:sticky;bottom:0;margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:14px 2px 16px;background:linear-gradient(to bottom,transparent,var(--panel) 14px);z-index:2}
.sf-row{display:flex;align-items:center;gap:6px}
#acct{flex:1;min-width:0}
.acct-chip{padding:8px 10px!important}
.new-btn{display:flex;align-items:center;gap:10px;width:100%;height:40px;padding:0 12px;border:0;border-radius:11px;background:var(--ink);color:var(--bg);
  font:500 13.5px var(--f-ui);cursor:pointer;transition:opacity .15s,transform .18s var(--ease)}
.new-btn:hover{opacity:.9}.new-btn:active{transform:scale(.98)}
.new-btn .ic{width:17px;height:17px}
.new-btn span{flex:1;text-align:left}
.new-btn kbd{background:transparent;border-color:color-mix(in srgb,var(--bg) 35%,transparent);color:color-mix(in srgb,var(--bg) 70%,transparent)}
.pop-item.wi{display:flex;align-items:center;gap:10px}
.pop-item.wi .ic{width:16px;height:16px;color:var(--muted)}
.pop-item .pk{margin-left:auto;padding-left:16px;font-size:11.5px;color:var(--muted)}
.pop-sep{height:1px;margin:5px 6px;background:var(--rule-soft)}
kbd{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border:1px solid var(--rule);border-radius:5px;background:var(--panel);
  font:500 10.5px/1 var(--f-ui);color:var(--muted);font-variant-numeric:tabular-nums}
.sbtn{width:100%;cursor:pointer;color:var(--muted);font:13px var(--f-ui);text-align:left}
.sbtn span{flex:1}
.sbtn:hover{border-color:var(--ink-2);color:var(--ink-2)}
.v-sbox{max-width:420px;margin:0 0 22px}

/* ---------- reading settings ---------- */
:root{--read-zoom:1;--read-w:720px}
.doc{max-width:var(--read-w)}
.docbody{zoom:var(--read-zoom)}
body.ff-sans .docbody{font-family:var(--f-ui)}
body.ff-sans .docbody .zh,body.ff-sans .docbody p.zh,body.ff-sans .docbody td.zh,body.ff-sans .docbody .ap{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",var(--f-ui)}
body.lh-compact .docbody{line-height:1.56}
body.lh-compact .docbody p.zh{line-height:1.78}
body.lh-compact .docbody table.verse td{line-height:1.45}
body.lh-relaxed .docbody{line-height:1.95}
body.lh-relaxed .docbody p.zh{line-height:2.2}
body.lh-relaxed .docbody table.verse td{line-height:1.85}
.typo{position:fixed;z-index:60;top:calc(var(--bar-h) + env(safe-area-inset-top,0px) + 6px);right:20px;width:316px;padding:16px;display:flex;flex-direction:column;gap:12px;
  background:var(--surface);border:1px solid var(--rule);border-radius:16px;box-shadow:var(--shadow);font-family:var(--f-ui);transform-origin:top right;animation:ty-in .22s var(--ease)}
.typo.out{animation:ty-out .14s ease forwards}
@keyframes ty-in{from{opacity:0;transform:translateY(-6px) scale(.97)}}
@keyframes ty-out{to{opacity:0;transform:translateY(-4px) scale(.98)}}
.ty-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ty-l{font-size:12.5px;color:var(--ink-2)}
.ty-step{display:flex;align-items:center;gap:2px;padding:3px;border-radius:11px;background:var(--rule-soft)}
.ty-step button{width:38px;height:28px;border:0;border-radius:8px;background:none;color:var(--ink-2);font:500 14px var(--f-read);cursor:pointer;transition:background .15s,color .15s,transform .15s var(--ease)}
.ty-step button small{font:500 11px var(--f-ui);margin-left:1px}
.ty-step button:hover{background:var(--surface);color:var(--ink)}
.ty-step button:active{transform:scale(.92)}
.ty-step button:disabled{opacity:.35;pointer-events:none}
#ty-fs{min-width:48px;text-align:center;font-size:12.5px;color:var(--ink);font-variant-numeric:tabular-nums}
.ty-foot{display:flex;align-items:center;gap:8px;padding-top:12px;border-top:1px solid var(--rule-soft)}
.ty-focus{flex:1;display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border:1px solid var(--rule);border-radius:10px;background:none;color:var(--ink-2);font:13px var(--f-ui);cursor:pointer;transition:border-color .15s,color .15s,background .15s}
.ty-focus span{flex:1;text-align:left}
.ty-focus:hover{border-color:var(--ink-2);color:var(--ink)}
.ty-focus .ic{width:16px;height:16px}
.ty-reset{border:0;background:none;font:12.5px var(--f-ui);color:var(--muted);cursor:pointer;padding:6px}
.ty-reset:hover{color:var(--ink)}
#typoopen[aria-expanded="true"]{background:var(--accent-soft);color:var(--accent)}
@media (max-width:560px){.typo{left:8px;right:8px;width:auto}}

/* ---------- focus mode ---------- */
@media (min-width:901px){
  body.focus .shell,body.focus .shell.side-closed{grid-template-columns:0 minmax(0,1fr)}
  body.focus .side{visibility:hidden;transform:translateX(-100%);transition:transform .36s var(--ease),visibility 0s .36s}
}
body.focus .toc{display:none!important}
body.focus #tocopen{display:none!important}
body.focus .reading{grid-template-columns:minmax(0,1fr)}
body.focus .toolbar{opacity:0;transition:opacity .35s var(--ease)}
body.focus .toolbar:hover,body.focus .toolbar:focus-within{opacity:1}
body.focus .player{left:50%}

/* ---------- command palette ---------- */
.cmdk-root{position:fixed;inset:0;z-index:110;display:flex;align-items:flex-start;justify-content:center;padding:13vh 16px 16px;background:var(--scrim);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:fade-in .16s ease}
.cmdk-root.closing{animation:fade-out .14s ease forwards}
.cmdk{width:min(640px,100%);max-height:min(580px,74vh);display:flex;flex-direction:column;overflow:hidden;background:var(--surface);border:1px solid var(--rule);
  border-radius:18px;box-shadow:var(--shadow);font-family:var(--f-ui);animation:dlg-in .26s var(--ease)}
.cmdk-root.closing .cmdk{animation:dlg-out .14s ease forwards}
.cmdk-in{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--rule-soft);color:var(--muted)}
.cmdk-in .ic{width:18px;height:18px}
.cmdk-in input{flex:1;min-width:0;border:0;outline:0;background:none;font:16px var(--f-ui);color:var(--ink)}
.cmdk-in input::placeholder{color:var(--muted)}
.cmdk-list{flex:1;overflow-y:auto;padding:6px 8px 8px;overscroll-behavior:contain;scroll-padding:8px}
.cmdk-g{padding:12px 10px 5px;font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.cmdk-it{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:42px;padding:8px 10px;border:0;border-radius:10px;background:none;
  text-align:left;cursor:pointer;color:var(--ink-2);font:13.5px var(--f-ui);transition:background-color .12s ease,color .12s ease}
.cmdk-it.on{background:var(--rule-soft);color:var(--ink)}
.cmdk-it.on::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:2px;border-radius:2px;background:var(--accent)}
.cmdk-it .ic{width:16px;height:16px;flex:none;color:var(--muted)}
.cmdk-it.on .ic{color:var(--ink)}
.cmdk-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.cmdk-t b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmdk-t span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmdk-t mark{background:none;color:var(--accent);font-weight:600}
.cmdk-r{flex:none;font-size:11.5px;color:var(--muted)}
.cmdk-none{padding:28px 12px;text-align:center;font-size:13px;color:var(--muted)}
.cmdk-foot{display:flex;align-items:center;gap:16px;padding:9px 16px;border-top:1px solid var(--rule-soft);font-size:11.5px;color:var(--muted)}
.cmdk-foot span{display:inline-flex;align-items:center;gap:5px}
@media (max-width:560px){.cmdk-root{padding-top:8px}.cmdk{max-height:80vh}.cmdk-foot{display:none}}

.info-body{font-family:var(--f-ui);font-size:13.5px;line-height:1.7;color:var(--ink-2)}
.info-body p{margin:0 0 10px}
dl.keys{display:grid;grid-template-columns:auto 1fr;gap:10px 18px;margin:0;align-items:center}
dl.keys dt{display:flex;gap:4px}dl.keys dd{margin:0;color:var(--ink)}
/* ---------- translation estimate ---------- */
.ps-est{display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px;margin:10px 0 0;font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.ps-est b{font-weight:600;color:var(--ink)}
.ps-est .lnk{border:0;background:none;padding:0;font:inherit;color:var(--ink-2);text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:.25em;cursor:pointer}
.ps-est .lnk:hover{color:var(--ink);text-decoration-color:var(--ink-2)}
.ps-est .dim{color:var(--muted)}
</style>

  function isCJK(ch){
    if(!ch) return false;
    var c=ch.charCodeAt(0);
    return (c>=0x2e80&&c<=0x9fff)||(c>=0xff00&&c<=0xffef)||'《》「」『』（）〔〕【】“”‘’，。；：？！、·'.indexOf(ch)>=0;
  }
  function blocks(txt){
    return txt.replace(/\r/g,'').split(/\n\s*\n+/).map(function(b){return b.trim();}).filter(Boolean);
  }
  function renderPaired(txt){
    var bs=blocks(txt), out=[], i=0;
    while(i<bs.length){
      var a=bs[i], zh='';
      if(!isCJK(a[0])){
        if(i+1<bs.length && isCJK(bs[i+1][0])){ zh=bs[i+1]; i++; }
        out.push('<div class="pair"><p class="en">'+esc(a).replace(/\n/g,' ')+'</p>'+
                 (zh?'<p class="zh">'+esc(zh).replace(/\n/g,' ')+'</p>':'')+'</div>');
      }else{
        out.push('<div class="pair"><p class="zh">'+esc(a).replace(/\n/g,' ')+'</p></div>');
      }
      i++;
    }
    return out.join('');
  }
  function renderPlain(txt){
    return blocks(txt).map(function(b){
      var cls=isCJK(b[0])?'zh':'en';
      return '<div class="pair"><p class="'+cls+'">'+esc(b).replace(/\n/g,'<br>')+'</p></div>';
    }).join('');
  }
  function inline(s){
    return esc(s)
      .replace(/`([^`]+)`/g,'<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
      .replace(/(^|[^*])\*([^*]+)\*/g,'$1<i>$2</i>');
  }
  function renderMd(txt){
    var out=[], list=null;
    blocks(txt).forEach(function(b){
      var lines=b.split('\n');
      if(/^#{1,3}\s/.test(lines[0]) && lines.length===1){
        var lv=lines[0].match(/^#+/)[0].length;
        out.push('<h'+(lv+1)+'>'+inline(lines[0].replace(/^#+\s*/,''))+'</h'+(lv+1)+'>');
        return;
      }
      if(/^[-*]\s/.test(lines[0])){
        out.push('<ul>'+lines.map(function(l){return '<li>'+inline(l.replace(/^[-*]\s*/,''))+'</li>';}).join('')+'</ul>');
        return;
      }
      if(/^>\s?/.test(lines[0])){
        out.push('<div class="pair quote"><p class="'+(isCJK(b.replace(/^>\s?/,'')[0])?'zh':'en')+'">'+
                 inline(lines.map(function(l){return l.replace(/^>\s?/,'');}).join(' '))+'</p></div>');
        return;
      }
      var cls=isCJK(b[0])?'zh':'en';
      out.push('<div class="pair"><p class="'+cls+'">'+inline(b).replace(/\n/g,' ')+'</p></div>');
    });
    return out.join('');
  }
  var OKTAG=/^(P|DIV|SPAN|B|STRONG|I|EM|U|BR|HR|H1|H2|H3|H4|H5|H6|UL|OL|LI|BLOCKQUOTE|TABLE|THEAD|TBODY|TR|TD|TH|CODE|PRE|SUP|SUB|A|FIGURE|FIGCAPTION|SMALL|SECTION|ARTICLE)$/;

        [].slice.call(c.attributes).forEach(function(a){

      input.id='f-'+f.name;

  function writeOrder(id,fid,order){

  function moveDocTo(id,fid,refId,after){
    var list=docsIn(fid).filter(function(x){return x.id!==id;});
    var idx=list.length;
    if(refId){ for(var i=0;i<list.length;i++) if(list[i].id===refId){ idx=after?i+1:i; break; } }
    var prev=list[idx-1], next=list[idx], order;
    if(prev&&next) order=(prev.order+next.order)/2;
    else if(prev) order=prev.order+1;
    else if(next) order=next.order-1;
    else order=0;
    // renormalise when gaps get too small
    if(prev&&next&&Math.abs(next.order-prev.order)<1e-6){
      var all=list.slice(); all.splice(idx,0,{id:id});
      var ps=all.map(function(x,k){ return x.id===id?null:writeOrder(x.id,fid,k); }).filter(Boolean);
      order=idx;
      var p0=writeOrder(id,fid,order); renderNav();
      return Promise.all(ps.concat([p0]));
    }
    var p=writeOrder(id,fid,order);
    renderNav(); if(current===id) show(id);
    return p;
  }

    var list=docsIn(fid), i=-1;
    list.forEach(function(x,k){ if(x.id===d.id) i=k; });
    var j=i+dir; if(i<0||j<0||j>=list.length) return;
    moveDocTo(d.id,fid,list[j].id,dir>0).catch(noop);
  }

  function dndItem(li,b,d,fid){

      try{ e.dataTransfer.dropEffect='move'; }catch(_){}
      var r=li.getBoundingClientRect(), after=e.clientY>r.top+r.height/2;
      clearDropMarks(); li.classList.add(after?'drop-after':'drop-before');

    li.addEventListener('drop',function(e){

      e.preventDefault(); e.stopPropagation();
      var r=li.getBoundingClientRect(), after=e.clientY>r.top+r.height/2, id=dragId;

  function buildToc(pane){

    var hs=[].slice.call(pane.querySelectorAll('.docbody h2, .docbody h3.mon, .docbody .sec'));
    hs.forEach(function(h,i){
      if(!h.id) h.id='sec-'+i+'-'+Math.random().toString(36).slice(2,6);
      var lc=h.cloneNode(true); [].slice.call(lc.querySelectorAll('.zh')).forEach(function(z){ if(lc.textContent.replace(z.textContent,'').trim()) z.remove(); });
      var label=lc.textContent.trim();
      label=label.replace(/\s+/g,' ');

      if(label.length>58) label=label.slice(0,56)+'…';
      var b=el('button','toc-link'+(h.tagName==='H3'?' lv2':''),label); b.type='button';
      b.addEventListener('click',function(){
        var y=h.getBoundingClientRect().top+window.scrollY-64;
        window.scrollTo({top:y,behavior:'smooth'});

  function spy(){
    if(!tocTargets.length||tocEl.hidden) return;
    var idx=0, y=window.scrollY+80;
    for(var i=0;i<tocTargets.length;i++){
      if(tocTargets[i].getBoundingClientRect().top+window.scrollY<=y) idx=i; else break;
    }
    tocLinks.forEach(function(b,i){b.classList.toggle('on',i===idx);});
    var active=tocLinks[idx];
    if(active){
      var lr=tocList.getBoundingClientRect(), ar=active.getBoundingClientRect();
      if(ar.top<lr.top||ar.bottom>lr.bottom) active.scrollIntoView({block:'nearest'});
    }
  }

  function noop(){}
  var BLOCK_SEL='p,li,td,th,h1,h2,h3,h4,h5,figcaption,dd,dt,.sec,.obs,.date,.wx,.nt,.nh';
  var marks={}, marksLocal=true;
  try{ var _lm=JSON.parse(lsGet('marks','{}')); if(_lm&&typeof _lm==='object') marks=_lm; }catch(e){}
  function saveLocal(){ if(marksLocal) lsSet('marks',JSON.stringify(marks)); }
  function curPane(){ return document.querySelector('.doc:not([hidden])'); }
  function getBlocks(pane){
    if(!pane) return [];
    var body=pane.querySelector('.docbody'); if(!body) return [];
    if(pane._blocks && pane._blocksBody===body) return pane._blocks;
    var leaf=[].slice.call(body.querySelectorAll(BLOCK_SEL)).filter(function(n){ return !n.querySelector(BLOCK_SEL); });
    leaf.forEach(function(n,i){ n.setAttribute('data-bi',i); });
    pane._blocks=leaf; pane._blocksBody=body; return leaf;
  }
  function blockOf(node){
    var e=node&&(node.nodeType===1?node:node.parentElement);
    return e?e.closest('[data-bi]'):null;
  }
  function offsetIn(block,node,off){
    var r=document.createRange(); r.setStart(block,0);
    try{ r.setEnd(node,off); }catch(e){ return 0; }
    return r.toString().length;
  }
  function posToDom(block,off){
    var w=document.createTreeWalker(block,NodeFilter.SHOW_TEXT,null),n,pos=0,last=null;
    while((n=w.nextNode())){ var L=n.data.length; if(off<=pos+L) return [n,Math.max(0,off-pos)]; pos+=L; last=n; }
    return last?[last,last.data.length]:[block,block.childNodes.length];
  }
  function rangeSegs(range){
    var pane=curPane(), blocks=getBlocks(pane), out=[];
    if(!pane||!pane.contains(range.commonAncestorContainer)) return out;
    for(var i=0;i<blocks.length;i++){
      var b=blocks[i];
      if(!range.intersectsNode(b)) continue;
      var len=b.textContent.length;
      var s=b.contains(range.startContainer)?offsetIn(b,range.startContainer,range.startOffset):0;
      var e=b.contains(range.endContainer)?offsetIn(b,range.endContainer,range.endOffset):len;
      var txt=b.textContent.slice(s,e);
      if(e>s && txt.trim()){
        var lead=txt.length-txt.replace(/^\s+/,'').length, trail=txt.length-txt.replace(/\s+$/,'').length;
        out.push({b:i,s:s+lead,e:e-trail});
      }
    }
    return out;
  }
  function wrapRange(block,s,e,make){
    var w=document.createTreeWalker(block,NodeFilter.SHOW_TEXT,null),n,pos=0,segs=[];
    while((n=w.nextNode())){
      var L=n.data.length;
      if(pos+L>s && pos<e) segs.push([n,Math.max(s,pos)-pos,Math.min(e,pos+L)-pos]);
      pos+=L; if(pos>=e) break;
    }
    segs.forEach(function(g){
      var node=g[0],a=g[1],z=g[2];
      if(z<=a) return;
      if(a>0){ node=node.splitText(a); z-=a; }
      if(z<node.data.length) node.splitText(z);
      var wr=make(); node.parentNode.insertBefore(wr,node); wr.appendChild(node);
    });
  }
  function makeWrap(m){
    return function(){
      var x;
      if(m.t==='h'){ x=document.createElement('mark'); x.className='an c-'+(m.c||'y'); }
      else { x=document.createElement('span'); x.className='an an-'+m.t; if(m.t==='n'){ x.setAttribute('data-mid',m._id||''); if(m.note) x.title=m.note; } }
      return x;
    };
  }
  function paintBlock(block,list){
    [].slice.call(block.querySelectorAll('.an')).forEach(function(x){
      var p=x.parentNode; while(x.firstChild) p.insertBefore(x.firstChild,x); p.removeChild(x);
    });
    block.normalize();
    var order={h:0,u:1,b:2,n:3};

  function startPdfJob(file,folder,tier,extra){
    var stem=file.name.replace(/\.pdf$/i,'').replace(/[_]+/g,' ').trim()||'Untitled PDF';
    var id=slug(stem).slice(0,60);
    var job=pdfJobs[id]={running:true,stop:false,ctls:[]};
    localStat[id]={status:'reading',read:'0'};
    current=id;
    var meta={title:stem,zh:'',author:'',folder:folder,format:'pdf',status:'reading',n:0,done:0,tier:tier,
      src:{name:file.name,size:file.size,pages:0},order:Date.now()/1e6,created:new Date().toISOString(),beat:Date.now(),renamed:false,glossary:[]};
    if(extra) Object.keys(extra).forEach(function(k){ meta[k]=extra[k]; });
    userDocs[id]=meta;
    db.doc('docs/'+id).set(meta).then(function(){
      return extractPdf(file,function(i,n){ setStat(id,{status:'reading',read:i+'/'+n}); });
    }).then(function(r){
      var items=buildBlocks(r.pages), chars=0;
      items.forEach(function(it){ chars+=it.en.length; });
      metaUpdate(id,{'src':{name:file.name,size:file.size,pages:r.pages.length,scanned:false}});
      if(chars < r.pages.length*150){
        return getSample().then(function(s){
          if(!s) throw {code:'no_sample'};
          metaUpdate(id,{status:'ocr',src:{name:file.name,size:file.size,pages:r.pages.length,scanned:true}});
          return ocrPdf(id,r.pdf,s,job);
        }).then(function(its){ return {items:its,meta:r.meta}; });
      }
      return {items:items,meta:r.meta};
    }).then(function(r){
      if(!r.items.length) throw {code:'empty',message:'没有从 PDF 中读到文字。'};
      var data={items:r.items}; layoutChunks(data); pdfMem[id]=data;
      var dc=doneCount(data);
      return saveAllChunks(id,data).then(function(){
        return metaUpdate(id,{n:dc[1],done:0,status:'naming',beat:Date.now()});
      }).then(function(){
        if(current===id){ keepScrollOnce=true; show(id); }
        return nameDoc(id,data,file.name,r.meta);
      });
    }).then(function(){
      job.running=false;
      readyToTranslate(id,false);
    }).catch(function(e){
      job.running=false;
      var msg=pdfErr(e);
      setStat(id,{status:'paused'});
      metaUpdate(id,{status:pdfMem[id]?'paused':'error',err:msg});
    });
  }

      images_unavailable:'这是扫描版 PDF，但当前选择的模型不支持识别图片，请在「AI 账号」里换一个支持图片的模型。',
