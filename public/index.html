  function nameDoc(id,data,fname,pm){
    return getSample().then(function(s){
      if(!s||!(window.PTL&&PTL.account())) return;
      var txt='', n=0;
      data.items.forEach(function(it){ if(it.k!=='pg' && txt.length<3500){ txt+=(txt?'\n\n':'')+it.en; } });
      var prompt='A university student uploaded a PDF reading to a bilingual (English–Chinese) study library. Give it a library entry.\n'+
        'File name: "'+fname+'"\nPDF metadata title: "'+(pm.title||'')+'"\nPDF metadata author: "'+(pm.author||'')+'"\n\n'+
        'Reply with only JSON: {"title": "...", "zh": "...", "author": "..."}\n'+
        '- title: the real work title as it would appear on a syllabus, concise (max 70 characters), e.g. "Panopticism (Discipline and Punish)" or "Objectivity and Authority (Porter 1991)" or "Seeing Like a State, Chapter 1". Never use the file name as is.\n'+
        '- zh: a Chinese title for the same work (max 28 characters), e.g. "全景敞视主义 · 《规训与惩罚》节选".\n'+
        '- author: author name(s) as printed, or "".\n\nBeginning of the text:\n'+txt;
      return s.json(prompt,{modelTier:'quick'}).then(function(o){
        var cur=userDocs[id]||{};
        if(cur.renamed||!o||typeof o.title!=='string'||!o.title.trim()) return;
        return metaUpdate(id,{named:true,title:o.title.trim().slice(0,120),zh:String(o.zh||'').trim().slice(0,60),author:String(o.author||'').trim().slice(0,120)});
      }).catch(function(e){ if(e&&(e.code==='not_granted'||e.code==='sampling_disabled')) throw e; });
    });
  }

  /* ---------- translation ---------- */
  function makeBatches(data){
    var out=[], cur=[], chars=0;
    data.items.forEach(function(it,i){
      if(!needsZh(it)) return;
      var L=it.en.length;
      if(cur.length && (chars+L>4200 || cur.length>=24)){ out.push(cur); cur=[]; chars=0; }
      cur.push(i); chars+=L;
    });
    if(cur.length) out.push(cur);
    return out;
  }
  function trPrompt(meta,data,idxs){
    var g=(meta.glossary||[]).slice(-60).map(function(p){return p[0]+' => '+p[1];}).join('; ');
    return 'You are translating an academic reading for a Chinese-speaking university student\'s bilingual study library.\n'+
      'Document: "'+(meta.title||'')+'"'+(meta.author?' by '+meta.author:'')+'\n\n'+
      'Translate each English block into fluent, faithful, academic Simplified Chinese. Translate every sentence fully; never summarize, merge or skip blocks. '+
      'For people, give the Chinese transliteration followed by the original name in full-width parentheses on first mention, e.g. 米歇尔·福柯（Michel Foucault）. '+
      'For key concepts, add the English term in parentheses on first use. Keep citations such as (Porter 1991, 23), numbers and footnote numerals unchanged. Block kinds: h = heading (keep it short), fn = footnote, p = paragraph.\n'+
      'The English came from PDF text extraction. If a block has obvious extraction damage (broken or run-together words, stray hyphens, ligature errors, lost dashes), also return the corrected English as "en"; fix only that damage and never reword the author. Omit "en" when nothing needs fixing.\n'+
      (g?'Keep these established translations consistent: '+g+'\n':'')+
      'Output exactly one JSON object per line and nothing else (no code fences): {"i": <block number>, "zh": "<Chinese>"} or {"i": <block number>, "en": "<corrected English>", "zh": "<Chinese>"}, one line per block, in order. '+
      'After the last block, add one final line {"glossary": [["English term", "中文译名"], ...]} with up to 8 key terms or names introduced in these blocks.\n\nBlocks:\n'+
      idxs.map(function(i){ var it=data.items[i]; return JSON.stringify({i:i,k:it.k,t:it.en}); }).join('\n');
  }
  function runTranslate(id){
    var job=pdfJobs[id]||(pdfJobs[id]={ctls:[]});
    if(job.running) return;
    job.running=true; job.stop=false; job.ctls=[];
    setStat(id,{status:'translating'});
    Promise.all([loadPdfData(id),getSample()]).then(function(r){
      var data=r[0], s=r[1];
      if(!s) throw {code:'no_sample'};
      var meta=userDocs[id]||{}, tier=meta.tier==='quick'?'quick':'default';
      metaUpdate(id,{status:'translating',err:'',beat:Date.now(),n:doneCount(data)[1]});
      var batches=makeBatches(data), qi=0, failed=null;
      function worker(){
        if(job.stop||failed||qi>=batches.length) return Promise.resolve();
        var b=batches[qi++];
        return translateBatch(id,data,b,s,tier,job).then(worker,function(e){ failed=e; job.ctls.forEach(function(c){ try{c.abort();}catch(_){} }); });
      }
      return Promise.all([worker(),worker()]).then(function(){
        return (job.wchain||Promise.resolve()).then(function(){
          job.running=false;
          var dc=doneCount(data), left=dc[1]-dc[0];
          if(failed && !(failed.code==='cancelled'&&job.stop)){ setStat(id,{status:'paused'}); metaUpdate(id,{status:'paused',err:pdfErr(failed),done:dc[0]}); }
          else if(job.stop){ setStat(id,{status:'paused'}); metaUpdate(id,{status:'paused',err:'',done:dc[0]}); }
          else if(!left){ setStat(id,{status:'done'}); metaUpdate(id,{status:'done',err:'',done:dc[0]}); }
          else { setStat(id,{status:'paused'}); metaUpdate(id,{status:'paused',err:'有 '+left+' 段没有译出，点“继续翻译”补上。',done:dc[0]}); }
        });
      });
    }).catch(function(e){
      job.running=false; setStat(id,{status:'paused'});
      metaUpdate(id,{status:'paused',err:pdfErr(e)});
    });
  }
  function translateBatch(id,data,idxs,s,tier,job){
    var meta=userDocs[id]||{};
    var ctl=new AbortController(); job.ctls.push(ctl);
    idxs.forEach(function(i){ markPend(id,i,true); });
    var buf='', got={};
    function eat(line){
      line=line.trim().replace(/,$/,''); if(!line||line[0]!=='{') return;
      var o; try{ o=JSON.parse(line); }catch(e){ return; }
      if(o && Array.isArray(o.glossary)){ addGlossary(id,o.glossary); return; }
      var i=Number(o&&o.i);
      if(idxs.indexOf(i)<0 || typeof o.zh!=='string' || !o.zh.trim()) return;
      var it=data.items[i];
      it.zh=o.zh.trim();
      if(typeof o.en==='string' && o.en.trim()){ var r=o.en.trim().length/Math.max(1,it.en.length); if(r>0.8&&r<1.25) it.en=o.en.trim(); }
      got[i]=1; applyItem(id,i);
    }
    return s(trPrompt(meta,data,idxs),{modelTier:tier,signal:ctl.signal,cache:false,onText:function(u){
      buf+=u.delta; var ls=buf.split('\n'); buf=ls.pop(); ls.forEach(eat);
    }}).then(function(r){
      if(buf){ eat(buf); buf=''; }
      if(!Object.keys(got).length) jsonLines(r.text).forEach(function(o){ eat(JSON.stringify(o)); });
    },function(e){
      if(buf){ eat(buf); buf=''; }
      throw e;
    }).then(function(){ return finishBatch(); },function(e){ finishBatch(); throw e; });
    function finishBatch(){
      idxs.forEach(function(i){ markPend(id,i,false); });
      var cs={}; idxs.forEach(function(i){ cs[data.chunkOf[i]]=1; });
      job.wchain=(job.wchain||Promise.resolve()).then(function(){
        return Promise.all(Object.keys(cs).map(function(c){ return chunkRef(id,+c).set(chunkBody(id,data,+c)); }));
      }).then(function(){
        var dc=doneCount(data);
        setStat(id,{done:dc[0],n:dc[1]});
        return metaUpdate(id,{done:dc[0],beat:Date.now()});
      }).catch(noop);
      return job.wchain;
    }
  }
  function addGlossary(id,pairs){
    var cur=(userDocs[id]&&userDocs[id].glossary)||[], seen={};
    cur=cur.slice();
    cur.forEach(function(p){ seen[String(p[0]).toLowerCase()]=1; });
    pairs.forEach(function(p){ if(Array.isArray(p)&&p.length>=2&&typeof p[0]==='string'&&typeof p[1]==='string'&&p[0].length<60&&p[1].length<40&&!seen[p[0].toLowerCase()]){ cur.push([p[0],p[1]]); seen[p[0].toLowerCase()]=1; } });
    cur=cur.slice(-80);
    if(userDocs[id]) userDocs[id].glossary=cur;
    metaUpdate(id,{glossary:cur});
  }
  function stopTranslate(id){
    var job=pdfJobs[id]; if(!job) return;

  function pdfItemHtml(it,i){
    if(it.k==='pg') return '<div class="pg">'+(it.lab?'原书 第 '+it.lab+' 页':'PDF 第 '+it.p+' 页')+'</div>';
    if(it.k==='sep') return '<p class="sep" data-pi="'+i+'" aria-hidden="true"></p>';

    if(it.k==='h') return '<h2 data-pi="'+i+'">'+esc(it.en)+'<span class="'+zc+'">'+esc(it.zh||'')+'</span></h2>';
    return '<div class="pair'+(it.k==='fn'?' fnote':'')+'" data-pi="'+i+'"><p class="en">'+esc(it.en)+'</p><p class="'+zc+'">'+esc(it.zh||'')+'</p></div>';
  }
  function pdfBodyHtml(data){
    var out=[], inUl=false;
    data.items.forEach(function(it,i){
      if(it.k==='ref'){ if(!inUl){ out.push('<ul class="refs">'); inUl=true; } out.push('<li data-pi="'+i+'">'+esc(it.en)+'</li>'); return; }
      if(inUl){ out.push('</ul>'); inUl=false; }
      out.push(pdfItemHtml(it,i));
    });
    if(inUl) out.push('</ul>');
    return out.join('\n');
  }
  function pdfItemEl(id,i){

  function applyItem(id,i){

  function pdfStatusInfo(id){

  function watchPdf(id){

    if(!db) return;
    pdfSubId=id;
    pdfSub=db.collection('pdf/'+id+'/chunks').onSnapshot(function(s){
      var job=pdfJobs[id]; if(job&&job.running) return;
      var data=pdfMem[id]; if(!data) return;
      s.docChanges().forEach(function(ch){
        if(ch.type==='removed') return;
        var b=ch.doc.data()||{}, from=b.from||0;
        (b.items||[]).forEach(function(it,k){
          var cur=data.items[from+k];
          if(cur && (cur.zh!==(it.zh||'') || cur.en!==(it.en||''))){ cur.zh=it.zh||''; cur.en=it.en||''; applyItem(id,from+k); }

  /* blocks of any doc, detached: [{el,text,page}] */
  var leafCache={};
  function docLeaves(id){
    if(leafCache[id]) return Promise.resolve(leafCache[id]);
    var live=document.getElementById(isBuiltin(id)?'doc-'+id:'__none');
    var htmlP;
    if(isBuiltin(id)) htmlP=live?Promise.resolve(live.outerHTML):fetchDocJson(id);
    else {
      var u=userDocs[id]; if(!u) return Promise.resolve([]);
      if(u.format==='pdf') htmlP=loadPdfData(id).then(function(d){ return '<div class="docbody">'+pdfBodyHtml(d)+'</div>'; });
      else htmlP=Promise.resolve('<div class="docbody">'+renderDocBody(u)+'</div>');
    }
    return htmlP.then(function(html){
      var t=document.createElement('template'); t.innerHTML=html;
      var body=t.content.querySelector('.docbody'); if(!body) return [];
      [].slice.call(body.querySelectorAll('.study')).forEach(function(x){x.remove();});
      var leaf=[].slice.call(body.querySelectorAll(BLOCK_SEL)).filter(function(n){ return !n.querySelector(BLOCK_SEL); });
      var page=null, pgs=[].slice.call(body.querySelectorAll('.pg')), pi=0;
      var all=[].slice.call(body.querySelectorAll('.pg, '+BLOCK_SEL));
      var pageOf=new Map();
      all.forEach(function(n){ if(n.classList.contains('pg')){ var p=pageFromMarker(id,n.textContent); if(p) page=p; } else pageOf.set(n,page); });
      var out=leaf.map(function(n){ var p=pageOf.get(n); return {text:n.textContent,page:p&&!p.scan?p.n:null,zh:n.classList.contains('zh')||!!n.closest('.zh')}; });
      leafCache[id]=out; return out;
    }).catch(function(){ return []; });
  }
  function collectMarks(){
    var byDoc={};
    Object.keys(marks).forEach(function(k){ var m=marks[k]; if(!m||!m.d) return; (byDoc[m.d]=byDoc[m.d]||[]).push(copy(m,{_id:k})); });
    var order=[]; folderList().forEach(function(f){ docsIn(f.id).forEach(function(d){ order.push(d.id); }); });
    var ids=Object.keys(byDoc).filter(docExists).sort(function(a,b){ return order.indexOf(a)-order.indexOf(b); });
    return Promise.all(ids.map(function(id){
      return docLeaves(id).then(function(leaves){
        var items=byDoc[id].map(function(m){ var lf=leaves[m.b]; return {t:m.t,c:m.c,b:m.b,s:m.s,note:m.note||'',x:(lf?lf.text.slice(m.s,m.e):'')||m.x||'',page:lf?lf.page:null,id:m._id}; });
        // merge adjacent pieces of the same mark type in the same block
        items.sort(function(a,b){ return (a.b-b.b)||(a.s-b.s); });
        var meta=docMeta(id);
        return {id:id,title:meta.title,author:meta.author,items:items};
      });
    }));

  }
  function applyTypo(save){
    typo.fs=Math.max(0,Math.min(FS.length-1,Math.round(+typo.fs)));
    if(isNaN(typo.fs)) typo.fs=2;
    var st=document.documentElement.style, b=document.body;
    st.setProperty('--read-zoom',FS[typo.fs]); st.setProperty('--read-w',WIDTHS[typo.w]||WIDTHS.normal);
    b.classList.toggle('lh-compact',typo.lh==='compact'); b.classList.toggle('lh-relaxed',typo.lh==='relaxed');
    b.classList.toggle('ff-sans',typo.ff==='sans');
    document.getElementById('ty-fs').textContent=Math.round(FS[typo.fs]*100)+'%';
    typoBox.querySelector('[data-fs="-1"]').disabled=typo.fs===0;
    typoBox.querySelector('[data-fs="1"]').disabled=typo.fs===FS.length-1;
    [['ty-lh','lh'],['ty-w','w'],['ty-ff','ff']].forEach(function(x){
      [].slice.call(document.querySelectorAll('#'+x[0]+' button')).forEach(function(bt){ bt.classList.toggle('on',bt.dataset.v===typo[x[1]]); });
    });
    if(save) lsSet('typo',JSON.stringify(typo));
  }
  function setTypo(k,v){ keepPlace(function(){ typo[k]=v; applyTypo(true); }); }
  [].slice.call(typoBox.querySelectorAll('[data-fs]')).forEach(function(bt){ bt.addEventListener('click',function(){ setTypo('fs',typo.fs+(+bt.dataset.fs)); }); });
  [['ty-lh','lh'],['ty-w','w'],['ty-ff','ff']].forEach(function(x){
    [].slice.call(document.querySelectorAll('#'+x[0]+' button')).forEach(function(bt){ bt.addEventListener('click',function(){ setTypo(x[1],bt.dataset.v); }); });
  });
  document.getElementById('ty-reset').addEventListener('click',function(){ keepPlace(function(){ typo=Object.assign({},TYPO0); applyTypo(true); }); });
  document.getElementById('ty-focus').addEventListener('click',function(){ setFocus(true); });
  function openTypo(){
    if(!typoBox.hidden) return;
    typoBox.classList.remove('out'); typoBox.hidden=false; typoBtn.setAttribute('aria-expanded','true');
    resyncSegs();
  }
  function closeTypo(){
    if(typoBox.hidden||typoBox.classList.contains('out')) return;
    typoBtn.setAttribute('aria-expanded','false');
    if(matchMedia('(prefers-reduced-motion:reduce)').matches){ typoBox.hidden=true; return; }
    typoBox.classList.add('out');
    setTimeout(function(){ if(typoBox.classList.contains('out')){ typoBox.hidden=true; typoBox.classList.remove('out'); } },150);
  }
  typoBtn.addEventListener('click',function(e){ e.stopPropagation(); if(typoBox.hidden||typoBox.classList.contains('out')) openTypo(); else closeTypo(); });
  document.addEventListener('mousedown',function(e){ if(!typoBox.hidden&&!typoBox.contains(e.target)&&!typoBtn.contains(e.target)) closeTypo(); });
  applyTypo(false);

  /* ---------------- focus mode ---------------- */
  function inFocus(){ return document.body.classList.contains('focus'); }
  function setFocus(on){
    if(on===inFocus()) return;
    keepPlace(function(){ document.body.classList.toggle('focus',on); });
    if(on){ closeTypo(); toast('专注模式 · 按 F 或 Esc 退出'); }
  }

  /* ---------------- backup ---------------- */
  function sinceText(ms){
    var d=Math.floor((Date.now()-ms)/864e5);
    return d<1?'今天':d===1?'昨天':d+' 天前';
  }
  function lastBackup(){ var t=+lsGet('lastBackup','0'); return t?'上次备份：'+sinceText(t):'还没有备份过'; }
  function exportBackup(){
    PTL.exportAll().then(function(b){
      lsSet('lastBackup',String(Date.now()));
      saveFile('parallel-text-library-'+todayISO()+'.json',new Blob([JSON.stringify(b)],{type:'application/json'}));
    }).catch(function(e){ alertBox('导出失败：'+((e&&e.message)||e)); });
  }
  function importBackup(){
    var file=null, armed=false;
    modal('从备份恢复',[
      {name:'file',label:'备份文件（.json）',type:'file',accept:'.json,application/json',
       after:function(i){ i.addEventListener('change',function(){ file=i.files&&i.files[0]||null; armed=false; }); }},
      {name:'mode',label:'恢复方式',type:'select',options:[
        {value:'merge',label:'合并：保留这台设备上的内容，同一文档以备份为准'},
        {value:'replace',label:'替换：先清空这台设备上的全部内容'}],
       after:function(i){ i.addEventListener('change',function(){ armed=false; }); }}
    ],function(v){
      if(!file) return {error:'请先选择备份文件。'};
      if(v.mode==='replace'&&!armed){ armed=true; return {error:'替换会删除这台设备上现有的全部文档、标注和生词。确定的话再点一次「恢复」。'}; }
      return file.text().then(function(t){
        var b; try{ b=JSON.parse(t); }catch(e){ return {error:'这个文件不是有效的 JSON。'}; }
        return PTL.importAll(b,v.mode).then(function(r){
          toast('已恢复 '+r.records+' 条记录，正在刷新…');
          setTimeout(function(){ location.reload(); },800);
        });
      }).catch(function(e){ return {error:(e&&e.message)||'恢复失败'}; });
    },'恢复');
    var t=mroot.querySelector('.mtitle');
    t.parentNode.insertBefore(el('p','fhint','备份包含文档、译文、标注、生词和阅读进度，不包含 AI 账号密钥。'),t.nextSibling);
  }

  /* ---------------- sidebar footer menus ---------------- */
  function newMenu(anchor){
    menu(anchor,[
      {icon:'upload',label:'上传 PDF / Word',run:function(){ uploadPdf(); }},
      {icon:'file-plus',label:'粘贴文章',run:function(){ newDoc(); }},
      {sep:1},
      {icon:'folder-plus',label:'新建文件夹',run:newFolder}
    ]);
  }
  function moreMenu(anchor){
    menu(anchor,[
      {icon:'type',label:'阅读设置',run:openTypo},
      {icon:'gear',label:'语音包管理',run:function(){ document.getElementById('vpopen').click(); }},
      {icon:'key',label:'AI 账号',run:function(){ PTL.openAccount(); }},
      {sep:1},
      {icon:'download',label:'导出备份',key:lastBackup().replace('上次备份：',''),run:exportBackup},
      {icon:'archive',label:'从备份恢复…',run:importBackup},
      {sep:1},
      {icon:'search',label:'搜索与命令',key:(MAC?'⌘':'Ctrl ')+'K',run:function(){ openCmdk(); }},
      {icon:'spark',label:'键盘快捷键',key:'?',run:showShortcuts},
      {icon:'book',label:'关于',run:showAbout}
    ]);
  }
  document.getElementById('newbtn').addEventListener('click',function(e){ e.stopPropagation(); if(db) newMenu(this); });
  document.getElementById('moremenu').addEventListener('click',function(e){ e.stopPropagation(); moreMenu(this); });
  function infoBox(title,html){
    modal(title,[],function(){ return true; },'知道了');
    var c=mroot.querySelector('.btn.ghost'); if(c) c.remove();
    var t=mroot.querySelector('.mtitle'), d=el('div','info-body'); d.innerHTML=html; t.parentNode.insertBefore(d,t.nextSibling);
  }
  function showShortcuts(){
    var M=MAC?'⌘':'Ctrl';
    infoBox('键盘快捷键','<dl class="keys">'+[
      [[M,'K'],'搜索与命令'],[['/'],'搜索与命令'],[['N'],'新建（上传或粘贴）'],[['F'],'专注模式'],
      [['空格'],'播放 / 暂停朗读'],[['Esc'],'关闭弹窗 · 退出专注模式'],[['?'],'显示这个列表']
    ].map(function(r){ return '<dt>'+r[0].map(function(k){ return '<kbd>'+k+'</kbd>'; }).join(' ')+'</dt><dd>'+r[1]+'</dd>'; }).join('')+'</dl>');
  }
  function showAbout(){
    infoBox('关于','<p>上传 PDF / Word 或粘贴文章，自动生成逐段中英对照译本，并支持标注、生词本、学习卡片与本地朗读。</p>'+
      '<p>文档、标注和生词只保存在这台设备的浏览器里，建议定期「导出备份」。翻译等 AI 功能使用你自己登录的 AI 账号，费用从你的账号扣除。</p>'+
      '<p>本地朗读使用开源模型 Kokoro-82M v1.1（Apache-2.0），在你的浏览器里生成。</p>');
  }

  /* ---------------- command palette (⌘K) ---------------- */
  var cmdk=null;
  function clickSeg(sel,attr,val){ var b=document.querySelector(sel+' button[data-'+attr+'="'+val+'"]'); if(b) b.click(); }
  function cmdkActions(){
    var A=[], acc=window.PTL&&PTL.account();
    function a(g,label,ic,run,sub,key){ A.push({g:g,label:label,ic:ic,run:run,sub:sub||'',key:key||''}); }
    a('跳转','首页','home',function(){ show('view:home'); });
    a('跳转','我的标注','note',function(){ show('view:notes'); });
    a('跳转','生词本','book',function(){ show('view:vocab'); });
    if(db){
      a('新建','上传 PDF / Word','upload',function(){ uploadPdf(); },'自动分段，翻译成中英对照','N');
      a('新建','粘贴文章','file-plus',function(){ newDoc(); },'粘贴英文原文，或已有的中英文');
      a('新建','新建文件夹','folder-plus',newFolder);
    }
    a('显示','中英对照','lang',function(){ clickSeg('#langseg','lang','both'); });
    a('显示','仅英文','lang',function(){ clickSeg('#langseg','lang','en'); });
    a('显示','仅中文','lang',function(){ clickSeg('#langseg','lang','zh'); });
    a('显示','阅读设置','type',openTypo,'字号 · 行距 · 栏宽 · 字体');
    a('显示',inFocus()?'退出专注模式':'专注模式','focus',function(){ setFocus(!inFocus()); },'','F');
    a('显示','放大字号','type',function(){ setTypo('fs',typo.fs+1); },Math.round(FS[typo.fs]*100)+'%');
    a('显示','缩小字号','type',function(){ setTypo('fs',typo.fs-1); },Math.round(FS[typo.fs]*100)+'%');
    a('显示','主题：跟随系统','auto',function(){ clickSeg('#themeseg','theme','system'); });
    a('显示','主题：明亮','sun',function(){ clickSeg('#themeseg','theme','light'); });
    a('显示','主题：暗色','moon',function(){ clickSeg('#themeseg','theme','dark'); });
    a('显示','显示 / 隐藏侧栏','sidebar',function(){ document.getElementById('sidetoggle').click(); });
    a('朗读','听书','headphones',function(){ document.getElementById('ttsopen').click(); },'','空格');
    a('朗读','语音包管理','gear',function(){ document.getElementById('vpopen').click(); });
    a('账号与数据','AI 账号','key',function(){ PTL.openAccount(); },acc?acc.label:'未登录');
    a('账号与数据','导出备份','download',exportBackup,lastBackup());
    a('账号与数据','从备份恢复','archive',importBackup);
    a('帮助','键盘快捷键','spark',showShortcuts,'','?');
    return A;
  }
  function cmdkDocs(){
    var out=[];
    folderList().forEach(function(f){
      docsIn(f.id).forEach(function(d){
        var u=userDocs[d.id]||{};
        out.push({g:'读物',label:d.title,ic:'book',sub:f.code+(d.zh?' · '+d.zh:'')+(u.author?' · '+u.author:''),extra:(u.author||''),doc:d.id,run:function(){ show(d.id); }});
      });
    });
    return out;
  }
  // every word of the query must appear; earlier and word-start hits rank higher
  function cmdkScore(q,it){
    var t=(it.label+' '+it.sub+' '+(it.extra||'')).toLowerCase(), lab=it.label.toLowerCase(), sc=0;
    var words=q.split(/\s+/).filter(Boolean);
    for(var i=0;i<words.length;i++){
      var w=words[i], k=lab.indexOf(w);
      if(k>=0) sc+=12-Math.min(k,10)*0.4+(k===0||/[\s·(（\-:：\/]/.test(lab[k-1])?6:0);
      else if(t.indexOf(w)>=0) sc+=4;
      else return 0;
    }
    return sc;
  }
  function hilite(label,q){
    var w=q.split(/\s+/).filter(Boolean)[0]; if(!w) return esc(label);
    var k=label.toLowerCase().indexOf(w); if(k<0) return esc(label);
    return esc(label.slice(0,k))+'<mark>'+esc(label.slice(k,k+w.length))+'</mark>'+esc(label.slice(k+w.length));
  }
  function cmdkResults(q){
    q=q.trim().toLowerCase();
    var docs=cmdkDocs(), acts=cmdkActions();
    if(!q){
      var recent=Object.keys(progress).filter(docExists).sort(function(a,b){ return (progress[b].at||0)-(progress[a].at||0); }).slice(0,5);
      var rd=recent.map(function(id){ for(var i=0;i<docs.length;i++) if(docs[i].doc===id) return Object.assign({},docs[i],{g:'最近阅读'}); return null; }).filter(Boolean);
      return rd.concat(acts.filter(function(x){ return x.g==='跳转'||x.g==='新建'; }),acts.filter(function(x){ return x.g==='账号与数据'||x.g==='帮助'; }));
    }
    function rank(list,max){ return list.map(function(x){ return {x:x,s:cmdkScore(q,x)}; }).filter(function(r){ return r.s>0; })
      .sort(function(a,b){ return b.s-a.s; }).slice(0,max).map(function(r){ return r.x; }); }
    var out=rank(docs,8).concat(rank(acts,8));
    if(q.length>=2) out.push({g:'全文搜索',label:'在全部读物中搜索 “'+q+'”',ic:'search',sub:'中英文段落都会搜',raw:true,run:function(){ searchQ=q; show('view:search'); }});
    return out;
  }
  function openCmdk(){
    if(cmdk) return;
    closePop(); closeTypo();
    var root=el('div','cmdk-root'); root.setAttribute('role','dialog'); root.setAttribute('aria-modal','true'); root.setAttribute('aria-label','搜索与命令');
    root.innerHTML='<div class="cmdk"><label class="cmdk-in"><svg class="ic"><use href="#i-search"></use></svg>'+
      '<input type="text" placeholder="搜索读物、跳转或执行命令…" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="true" aria-controls="cmdk-list"></label>'+
      '<div class="cmdk-list" id="cmdk-list" role="listbox"></div>'+
      '<div class="cmdk-foot"><span><kbd>↑</kbd><kbd>↓</kbd> 选择</span><span><kbd>↵</kbd> 打开</span><span><kbd>Esc</kbd> 关闭</span></div></div>';
    document.body.appendChild(root);
    var inp=root.querySelector('input'), list=root.querySelector('.cmdk-list'), items=[], sel=0;
    cmdk={root:root};
    function render(){
      var q=inp.value; items=cmdkResults(q); sel=Math.min(sel,Math.max(0,items.length-1));
      if(!items.length){ list.innerHTML='<p class="cmdk-none">没有找到匹配的读物或命令</p>'; return; }
      var h='', g='';
      items.forEach(function(it,i){
        if(it.g!==g){ g=it.g; h+='<div class="cmdk-g">'+esc(g)+'</div>'; }
        h+='<button type="button" class="cmdk-it'+(i===sel?' on':'')+'" role="option" id="cmdk-'+i+'" data-i="'+i+'" aria-selected="'+(i===sel)+'">'+
          '<svg class="ic"><use href="#i-'+it.ic+'"></use></svg><span class="cmdk-t"><b>'+(it.raw?esc(it.label):hilite(it.label,q.trim().toLowerCase()))+'</b>'+
          (it.sub?'<span>'+esc(it.sub)+'</span>':'')+'</span>'+(it.key?'<kbd class="cmdk-r">'+esc(it.key)+'</kbd>':'')+'</button>';
      });
      list.innerHTML=h;
      inp.setAttribute('aria-activedescendant','cmdk-'+sel);
    }
    function move(d){
      if(!items.length) return;
      sel=(sel+d+items.length)%items.length;
      [].slice.call(list.querySelectorAll('.cmdk-it')).forEach(function(b){ var on=+b.dataset.i===sel; b.classList.toggle('on',on); b.setAttribute('aria-selected',on); if(on) b.scrollIntoView({block:'nearest'}); });
      inp.setAttribute('aria-activedescendant','cmdk-'+sel);
    }
    function run(i){ var it=items[i]; if(!it) return; closeCmdk(); setTimeout(it.run,0); }
    inp.addEventListener('input',function(){ sel=0; render(); list.scrollTop=0; });
    inp.addEventListener('keydown',function(e){
      if(e.key==='ArrowDown'){ e.preventDefault(); move(1); }
      else if(e.key==='ArrowUp'){ e.preventDefault(); move(-1); }
      else if(e.key==='Enter'){ e.preventDefault(); run(sel); }
      else if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); closeCmdk(); }
    });
    list.addEventListener('mousemove',function(e){ var b=e.target.closest('.cmdk-it'); if(b&&+b.dataset.i!==sel){ sel=+b.dataset.i; move(0); } });
    list.addEventListener('click',function(e){ var b=e.target.closest('.cmdk-it'); if(b) run(+b.dataset.i); });
    root.addEventListener('mousedown',function(e){ if(e.target===root) closeCmdk(); });
    render(); inp.focus();
  }
  function closeCmdk(){
    if(!cmdk) return;
    var r=cmdk.root; cmdk=null;
    if(matchMedia('(prefers-reduced-motion:reduce)').matches){ r.remove(); return; }
    r.classList.add('closing'); setTimeout(function(){ r.remove(); },150);
  }
  document.getElementById('cmdkopen').addEventListener('click',function(){ openCmdk(); });

  /* ---------------- keyboard ---------------- */
  function typingIn(t){ return t&&(t.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)); }
  document.addEventListener('keydown',function(e){
    if((e.metaKey||e.ctrlKey)&&!e.altKey&&!e.shiftKey&&(e.key==='k'||e.key==='K')){ e.preventDefault(); if(cmdk) closeCmdk(); else openCmdk(); return; }
    if(cmdk||e.metaKey||e.ctrlKey||e.altKey||typingIn(e.target)||!mroot.hidden||document.querySelector('.mroot:not(#modal)')) return;
    if(e.key==='Escape'){ if(!typoBox.hidden) closeTypo(); else if(inFocus()) setFocus(false); return; }
    if(e.key==='/'){ e.preventDefault(); openCmdk(); }
    else if(e.key==='f'||e.key==='F'){ e.preventDefault(); setFocus(!inFocus()); }
    else if(e.key==='?'){ e.preventDefault(); showShortcuts(); }
    else if((e.key==='n'||e.key==='N')&&db){
      e.preventDefault();
      var nb=document.getElementById('newbtn'), r=nb.getBoundingClientRect();
      if(r.width&&r.left>=0&&!inFocus()) newMenu(nb); else openCmdk();
    }
  });

  /* ---------------- boot ---------------- */
  try{ var _lv=JSON.parse(lsGet('vocab','{}')); if(_lv&&typeof _lv==='object') vocab=_lv; }catch(e){}
  if(!(window.claude && window.claude.use)) dbReady=true;
  renderNav(); show(current);
  window.addEventListener('ptl:account',function(){ if(current==='view:home'){ keepScrollOnce=true; show('view:home'); } else if(userDocs[current]&&userDocs[current].format==='pdf') updatePdfStat(current); });

  if(window.claude && window.claude.use){
    window.claude.use('db').then(function(d){
      if(!d){ dbReady=true; if(!isBuiltin(current)&&!/^view:/.test(current)) show(firstDocId()); return; }
      db=d;
      annotOnDb(d);
      db.collection('progress').onSnapshot(function(s){
        s.docs.forEach(function(doc){ var r=doc.data()||{}, l=progress[doc.id]||{};
          progress[doc.id]={pct:Math.max(r.pct||0,l.pct||0),done:!!(r.done||l.done),at:Math.max(r.at||0,l.at||0)}; });
        lsSet('progress',JSON.stringify(progress)); updateNavProgress();
      },function(){});
      db.collection('vocab').onSnapshot(function(s){
        var v={}; s.docs.forEach(function(doc){ v[doc.id]=doc.data(); });
        try{ var lv=JSON.parse(lsGet('vocab','{}')); Object.keys(lv).forEach(function(k){ if(!v[k]){ v[k]=lv[k]; d.doc('vocab/'+k).set(lv[k]).catch(noop); } }); lsSet('vocab','{}'); }catch(_){}
        vocab=v; renderNav(); if(current==='view:vocab'&&!document.querySelector('#vc-review:not([hidden])')){ keepScrollOnce=true; show('view:vocab'); }
      },function(){});
      db.collection('folders').onSnapshot(function(s){
        dbFolders={}; s.docs.forEach(function(doc){dbFolders[doc.id]=doc.data();});
        renderNav();
      },function(){});
      db.collection('docs').onSnapshot(function(s){
        var prev=userDocs[current];
        var keysBefore=Object.keys(userDocs).sort().join();
        userDocs={}; s.docs.forEach(function(doc){userDocs[doc.id]=doc.data();});
        if(Object.keys(userDocs).sort().join()!==keysBefore) invalidateIndex();
        var firstLoad=!dbReady; dbReady=true;
        renderNav();
        if(firstLoad && !userDocs[current] && !isBuiltin(current) && !/^view:/.test(current)){ show(firstDocId()); return; }
        var d=userDocs[current];
        if(d){
          if(d.format==='pdf') pdfMetaChanged(current,prev,d);
          else if(!prev||['title','zh','author','body','format','paired','folder'].some(function(k){return prev[k]!==d[k];})){ keepScrollOnce=!!prev; show(current); }
        }
      },function(){});
      db.collection('placement').onSnapshot(function(s){
        placement={}; s.docs.forEach(function(doc){placement[doc.id]=doc.data();});
        renderNav();
        if((placement[current]||{}).hidden){ show(firstDocId()); }
        else if(BUILTIN_DOCS.some(function(d){return d.id===current;})) applyBuiltinHead(current);
      },function(){});
      renderNav();
    }).catch(function(){});
  }
})();
</script>
